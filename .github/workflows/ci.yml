name: CI

on:
  push:
    branches: [main]
    # Docs-only edits do not need seven runners — skip the whole workflow.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - ".opencode/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - ".opencode/**"
  # Validate workflow changes on a branch without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read

# A superseded run only reports on stale code: cancel it so the newest commit
# gets the runners (and the cache write slots) instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ═══════════════════════════════════════════════════════════════════════════
# Caching / RUSTFLAGS contract — read before editing a job below.
#
# `actions-rust-lang/setup-rust-toolchain` runs swatinem/rust-cache internally
# (`cache: true` is its default). Every job here therefore passes `cache: false`
# and runs `swatinem/rust-cache` explicitly exactly once. Doing both stored two
# ~1-2 GB entries per job (~10 GB in total, GitHub's per-repo ceiling) and the
# resulting LRU evictions are what turned every tagged release into a cold
# 16-minute rebuild of Slint/Skia: the release caches never survived.
#
# `rustflags: ""` leaves RUSTFLAGS unset so `.cargo/config.toml` stays the single
# source of truth for codegen/linker flags (x86-64-v3, and rust-lld +
# /FORCE:MULTIPLE on Windows). The action's old default (`RUSTFLAGS=-D warnings`)
# *replaced* the config file's flags for every Rust step; the two Windows-only
# overrides that existed to compensate (`-C linker=lld-link`, then `-D warnings`
# on the native test step) changed the build fingerprint three times in one job
# and rebuilt the whole Skia/winit graph on each switch.
#
# Warnings are still fatal: `CARGO_BUILD_WARNINGS: deny` (cargo's own
# `build.warnings`, orthogonal to RUSTFLAGS) plus clippy's `-- -D warnings`. It is
# set per job, *not* workflow-wide: cargo denies linker warnings too, and linking
# the Skia-based limedl-native with rust-lld legitimately warns about Skia's
# duplicate ICU symbols (`ubrk_getLocaleByType`, fixed by /FORCE:MULTIPLE) — so
# `test-windows-native` keeps its build warnings visible but not fatal, and the
# workspace clippy in `check-windows` remains the Windows lint gate.
#
# Windows-only steps (every Windows job):
# - Windows Defender's real-time scanner inspects every file cargo writes into
#   target/ (multi-GB per run) and is the dominant Windows-vs-Linux penalty we
#   can remove for free. The exclusions are best-effort — a runner policy change
#   must not fail the job — so failures are swallowed and only the resulting
#   protection state is logged.
#
# Test execution:
# - Tests run under `cargo nextest` (pinned through taiki-e/install-action):
#   nextest executes each test in its own process, which parallelizes execution
#   and removes the cross-test global-state interference a single libtest
#   process per binary used to expose (see testing-guide.md). `cargo nextest run`
#   does not run doctests — the workspace has none today; if a doctest is ever
#   added, add a `cargo test --doc` step to check-rust.
# ═══════════════════════════════════════════════════════════════════════════

jobs:
  lint-typescript:
    name: Lint & Type-check (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run lint
      - run: pnpm exec vue-tsc --noEmit
      - run: pnpm run test:coverage

  e2e-nas-webui:
    name: E2E (nas-webui Chromium)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright system dependencies
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: e2e-nas-webui
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libappindicator3-dev
      - name: Build frontend (NAS mode)
        run: pnpm run build:nas
      - name: Build limedl-server
        run: cargo build --locked --release --manifest-path crates/limedl-server/Cargo.toml --bin limedl
      - name: Start limedl-server daemon
        # The daemon process is auto-reaped when the job ends (no explicit shutdown needed)
        run: |
          ./target/release/limedl daemon --user e2e --pass e2epass --port 9090 > server.log 2>&1 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          # Wait for the server to be ready
          for i in {1..30}; do
            if curl -sf -u e2e:e2epass http://localhost:9090/ > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
          curl -sf -u e2e:e2epass http://localhost:9090/ > /dev/null || { echo "Server failed to start"; cat server.log; exit 1; }
      - name: Run E2E tests (nas-webui project)
        run: pnpm run test:e2e:nas
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # Playwright resolves the HTML report folder relative to the config
          # file (e2e/), while traces/screenshots go to test-results/ at the
          # repo root — upload both so a failure is diagnosable.
          name: playwright-report-nas-webui
          path: |
            e2e/playwright-report/
            test-results/
          if-no-files-found: warn
      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: limedl-server-logs
          path: server.log
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════
  # Windows — three parallel jobs instead of one serial chain.
  #
  # Windows is the slowest platform and therefore CI's critical path. clippy is
  # check-only and cannot share artifacts with the test builds, so running it in
  # the same job only serialized the wall clock. The jobs are split so that
  # clippy + the tls check, the limedl-core tests, and the server + native tests
  # each run in parallel (measured steps: ~2.7 min clippy, ~2.6 min core tests,
  # ~5.8 min server + native tests).
  # ═══════════════════════════════════════════════════════════════════════
  check-windows:
    name: Check & Clippy (Windows)
    runs-on: windows-latest
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Windows Defender's real-time scanner inspects every file cargo writes
      # into target/ (multi-GB per run) — the dominant Windows-vs-Linux penalty
      # we can remove for free. Best-effort: a runner policy change must not fail
      # the job, so failures are swallowed and only the resulting state is logged.
      - name: Exclude build paths from Defender real-time scanning
        shell: pwsh
        run: |
          foreach ($path in @($env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", $env:RUNNER_TEMP)) {
            Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
          }
          if ($status = Get-MpComputerStatus -ErrorAction SilentlyContinue) {
            Write-Host "Defender real-time protection enabled: $($status.RealTimeProtectionEnabled)"
          }
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: clippy
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      # limedl-native embeds MiSans VF at compile time; the font is not in git
      # (MiSans font license) — fetch it from the official source first. Cached so
      # a transient CDN hiccup cannot break the job (key = pinned font hash).
      - name: Cache bundled MiSans VF font
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: crates/limedl-native/assets/fonts/MiSansVF.ttf
          key: misans-vf-${{ runner.os }}-0ddef906
      - name: Fetch bundled MiSans VF font
        shell: pwsh
        run: ./scripts/fetch-misans.ps1
      # Windows-only cfg code (`tray`, updater, winreg, file locking) is linted
      # here and nowhere else, so this stays a full workspace clippy.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # limedl-core tests live in the standalone `test-windows-core` job below:
      # clippy and test builds share no artifacts, so serializing them only added
      # the test step's wall clock to this job.
      # Verify the optional `tls` feature compiles — CI otherwise never exercises it.
      - run: cargo check --manifest-path crates/limedl-server/Cargo.toml --features tls

  test-windows-core:
    name: "Test (Windows: limedl-core)"
    runs-on: windows-latest
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Exclude build paths from Defender real-time scanning
        shell: pwsh
        run: |
          foreach ($path in @($env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", $env:RUNNER_TEMP)) {
            Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
          }
          if ($status = Get-MpComputerStatus -ErrorAction SilentlyContinue) {
            Write-Host "Defender real-time protection enabled: $($status.RealTimeProtectionEnabled)"
          }
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: nextest@0.9.144
      # The Windows branches of limedl-core (platform.rs, settings.rs,
      # file_ops/{mod,disk_detect}.rs) only run here — check-rust covers the same
      # test suite on Linux, but compiles the unix branches. Deliberately no
      # MiSans font step: `-p limedl-core` never builds the UI crate.
      - run: cargo nextest run --manifest-path crates/limedl-core/Cargo.toml --features "test-utils,aria2-rpc"

  test-windows-native:
    name: "Test (Windows: server + limedl-native)"
    runs-on: windows-latest
    # No `CARGO_BUILD_WARNINGS: deny` here (unlike every other Rust job): linking
    # the Skia-based binary with rust-lld warns about Skia's duplicate ICU
    # symbols, and cargo's `build.warnings` denies linker warnings as well. The
    # warnings gate for this job is `check-windows`' workspace clippy.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Exclude build paths from Defender real-time scanning
        shell: pwsh
        run: |
          foreach ($path in @($env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", $env:RUNNER_TEMP)) {
            Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
          }
          if ($status = Get-MpComputerStatus -ErrorAction SilentlyContinue) {
            Write-Host "Defender real-time protection enabled: $($status.RealTimeProtectionEnabled)"
          }
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: nextest@0.9.144
      - name: Cache bundled MiSans VF font
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: crates/limedl-native/assets/fonts/MiSansVF.ttf
          key: misans-vf-${{ runner.os }}-0ddef906
      - name: Fetch bundled MiSans VF font
        shell: pwsh
        run: ./scripts/fetch-misans.ps1
      - run: cargo nextest run --manifest-path crates/limedl-server/Cargo.toml
      # limedl-native: pure logic tests (UI form mapping, i18n, batching, updater
      # manifest parsing). Only Windows runs them because the crate is currently
      # only released for Windows.
      - run: cargo nextest run --manifest-path crates/limedl-native/Cargo.toml

  check-macos:
    name: Check & Test (macOS)
    runs-on: macos-14
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: clippy
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: nextest@0.9.144
      # macOS ships WebKit natively — no apt install needed.
      # limedl-native embeds MiSans VF at compile time; the font is not in git
      # (MiSans font license) — fetch it from the official source first. Cached so
      # a transient CDN hiccup cannot break the job (key = pinned font hash).
      - name: Cache bundled MiSans VF font
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: crates/limedl-native/assets/fonts/MiSansVF.ttf
          key: misans-vf-${{ runner.os }}-0ddef906
      - name: Fetch bundled MiSans VF font
        shell: pwsh
        run: ./scripts/fetch-misans.ps1
      # `cfg(target_os = "macos")` code lives in limedl-core (platform, disk
      # detect, io topology) and limedl-server (config) as well as the UI crate,
      # so this stays a full workspace clippy.
      # All tests in these crates are pure Rust logic tests that
      # do not require a display server.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --manifest-path crates/limedl-core/Cargo.toml --features "test-utils,aria2-rpc"
      - run: cargo nextest run --manifest-path crates/limedl-server/Cargo.toml

  check-rust:
    name: Check, Clippy & Test (Rust)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: clippy
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libappindicator3-dev
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-llvm-cov
      # limedl-native embeds MiSans VF at compile time; the font is not in git
      # (MiSans font license) — fetch it from the official source first. Cached so
      # a transient CDN hiccup cannot break the job (key = pinned font hash).
      - name: Cache bundled MiSans VF font
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: crates/limedl-native/assets/fonts/MiSansVF.ttf
          key: misans-vf-${{ runner.os }}-0ddef906
      - name: Fetch bundled MiSans VF font
        shell: pwsh
        run: ./scripts/fetch-misans.ps1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check ts-rs bindings are up-to-date
        run: |
          cargo test --manifest-path crates/limedl-core/Cargo.toml --features ts export_typescript_bindings
          git diff --exit-code src/types/generated/ src/lib/ws/generated/
      - name: Run tests with coverage
        run: |
          # `--profile dev` keeps line tables for source attribution: the test
          # profile drops debug info (see Cargo.toml) to cut CI link time.
          cargo llvm-cov --profile dev --manifest-path crates/limedl-core/Cargo.toml --features "test-utils,aria2-rpc" --lcov --output-path lcov-core.info
          cargo llvm-cov --profile dev --manifest-path crates/limedl-server/Cargo.toml --lcov --output-path lcov-server.info
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-coverage-lcov
          path: lcov-*.info
          if-no-files-found: warn

  bench-rust:
    name: Benchmark (Rust)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_WARNINGS: deny
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libappindicator3-dev

      - name: Restore main baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: criterion-baseline
          key: criterion-${{ runner.os }}-main-ci

      - name: Link baseline
        run: |
          if [ -d "criterion-baseline" ] && [ "$(ls -A criterion-baseline 2>/dev/null)" ]; then
            mkdir -p target/criterion
            cp -r criterion-baseline/* target/criterion/
          fi

      - name: Run benchmarks
        run: cargo bench --manifest-path crates/limedl-core/Cargo.toml --features test-utils --bench aimd --bench rate_limiter

      - name: Copy results to baseline
        if: github.event_name == 'push'
        run: |
          rm -rf criterion-baseline
          mkdir -p criterion-baseline
          for bench in aimd rate_limiter; do
            if [ -d "target/criterion/$bench" ]; then
              cp -r "target/criterion/$bench" criterion-baseline/
            fi
          done
          if [ -d "target/criterion/report" ]; then
            cp -r target/criterion/report criterion-baseline/
          fi

      - name: Cache baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: criterion-baseline
          key: criterion-${{ runner.os }}-main-ci

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: criterion-report
          path: criterion-baseline/report/

  supply-chain:
    name: Supply Chain (cargo-deny + cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          # These tools never compile the workspace — the registry is all they need.
          cache-targets: false

      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-deny
      - run: cargo deny check -W rejected bans licenses sources

      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-audit
      - run: cargo audit
