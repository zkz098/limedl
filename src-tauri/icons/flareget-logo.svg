<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="flareget logo">
  <title>flareget</title>
  <desc>A minimal flare spark above a downward arrow.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:title>flareget Logo</dc:title>
        <dc:creator>flareget Design</dc:creator>
        <dc:description>Restrained app icon mark for flareget — a warm dark square with a white arrow and a small amber flare spark.</dc:description>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <!-- Warm dark background with generous padding and rounded corners -->
  <rect x="64" y="64" width="384" height="384" rx="96" ry="96" fill="#1c1917" />

  <!-- Amber flare spark: three short rounded rays above the arrow -->
  <g stroke="#facc15" stroke-width="18" stroke-linecap="round">
    <line x1="256" y1="140" x2="256" y2="100" />
    <line x1="256" y1="140" x2="218" y2="102" />
    <line x1="256" y1="140" x2="294" y2="102" />
  </g>

  <!-- Bold white downward arrow -->
  <path fill="#ffffff" d="M234,180 L278,180 L278,300 L322,300 L256,380 L190,300 L234,300 Z" />
</svg>
