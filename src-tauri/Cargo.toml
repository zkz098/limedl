[package]
name = "limedl"
version.workspace = true
description = "Tauri v2 desktop download manager — HTTP, BitTorrent"
authors = ["limedl contributors"]
license.workspace = true
edition = "2024"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The _lib suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "limedl_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
limedl-core = { path = "../crates/limedl-core", features = ["aria2-rpc"] }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-os = { workspace = true }
mimalloc = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
base64 = { workspace = true }
minisign-verify = { workspace = true }
rand = { workspace = true, optional = true }

[features]
test-utils = ["limedl-core/test-utils", "limedl-core/aria2-rpc", "rand"]

[dev-dependencies]
tempfile = { workspace = true }
ntest = { workspace = true }
bytes = { workspace = true }
