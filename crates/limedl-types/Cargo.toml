[package]
name = "limedl-types"
version.workspace = true
description = "Foundation layer for limedl — domain types, settings, errors, events, manifests and the contracts every other limedl crate shares"
license.workspace = true
edition = "2024"
# Workspace-internal, like every other limedl crate: the split exists to give the
# compiler the layering that `module_boundaries_tests` used to police by hand,
# not to publish. `publish = false` is what makes `pub(crate)` -> `pub`
# promotions a non-event for semver.
publish = false

[lib]
name = "limedl_types"

[dependencies]
# Nothing in this crate may depend on another `limedl-*` crate, and nothing may
# depend on a protocol engine: it is the bottom of the graph. Everything here is
# either data (serde), a contract (async-trait, thiserror) or the transport types
# the contract is expressed in (`url::Url`, `http::header`, `reqwest::Error`).
#
# `url` and `http` are what `reqwest::Url` / `reqwest::header` *are* (reqwest
# re-exports both), so naming them directly costs nothing at the call sites and
# removes reqwest from `settings`, `url_rewrite` and `checksum::detect`. Only
# `DownloadError::Http(#[from] reqwest::Error)` is left, and that variant is
# load-bearing: `?` on a reqwest call has to convert, and a `From` impl for a
# foreign source type can only live where the target type is defined — here.
tokio = { workspace = true }
# Declared directly instead of `workspace = true` on purpose: the workspace entry
# carries the feature list (`http3`, `gzip`, `brotli`, `zstd`), and `workspace =
# true` re-inherits it. Those features belong to `limedl-http` and
# `limedl-engine`, which request them where the client is actually built. Cargo
# unifies features across a build, so a workspace build is unchanged; an isolated
# `cargo check -p limedl-store` no longer compiles quinn/rustls/h3/brotli/zstd to
# get nowhere. Keep the version equal to the workspace entry.
reqwest = { version = "=0.13.5", default-features = false }
url = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
percent-encoding = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
dashmap = { workspace = true }
foldhash = { workspace = true }
# No BitTorrent engine here on purpose: `TaskId::Bt` carries this crate's own
# `InfoHash([u8; 20])`, and `bt_backend` converts to/from `librqbit::dht::Id20`
# at the one boundary that talks to the engine. Adding `librqbit` back would put
# 100+ crates of DHT/peer-wire/`aws-lc` under every limedl crate.

[features]
# `bt` no longer selects a dependency — it only decides whether `TaskKind::Bt` /
# `TaskId::Bt` exist. The gate stays because the engine builds a documented
# "BitTorrent absent" configuration (`limedl-core --no-default-features`) in
# which those variants must not exist at all: keeping them would make every
# `#[cfg(feature = "bt")]` match arm in the engine non-exhaustive.
#
# Deliberately no default: a crate-level default would silently re-enable the
# variants for a consumer that asked for `limedl-core --no-default-features`.
# The engine's own `default = ["bt"]` forwards to this feature.
default = []
bt = []

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }
