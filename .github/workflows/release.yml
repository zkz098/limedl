name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Tauri Desktop — platform-specific bundles (MSI, DMG, deb, AppImage)
  # ═══════════════════════════════════════════════════════════════════════
  build-tauri:
    name: Tauri ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest

          - name: macos-universal
            os: macos-latest
            tauri-args: --target universal-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # ── Node.js & frontend deps ────────────────────────────────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-release-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-release-${{ runner.os }}-

      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # ── Rust toolchain ─────────────────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-tauri-${{ matrix.name }}

      # ── Linux system deps (Tauri requires WebKit) ──────────────────────
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ── macOS universal: add x86_64 target for cross-compilation ──────
      - name: Add macOS x86_64 target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      # ── Build Tauri ────────────────────────────────────────────────────
      - name: Build Tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "v${{ steps.version.outputs.VERSION }}"
          releaseBody: ""
          releaseDraft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.tauri-args || '' }}

  # ═══════════════════════════════════════════════════════════════════════
  # Tauri Desktop — Linux AppImage (with Wayland library pruning)
  # ═══════════════════════════════════════════════════════════════════════
  build-tauri-linux:
    name: Tauri linux-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # ── Node.js & frontend deps ────────────────────────────────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-release-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-release-${{ runner.os }}-

      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # ── Rust toolchain ─────────────────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-tauri-linux-x86_64

      # ── Linux system deps ──────────────────────────────────────────────
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ── Build Tauri AppImage ───────────────────────────────────────────
      - name: Build Tauri AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles appimage

      # ── Download appimagetool ──────────────────────────────────────────
      - name: Download appimagetool
        run: |
          mkdir -p .tools
          curl --fail --show-error --location --proto '=https' \
            -o .tools/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x .tools/appimagetool

      # ── Prune bundled Wayland libraries ────────────────────────────────
      - name: Prune bundled Wayland libraries from AppImage
        run: |
          APPIMAGE=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage artifact found" >&2
            exit 1
          fi
          node scripts/prune-appimage-wayland-libs.mjs \
            --appimage "$APPIMAGE" \
            --appimagetool "$PWD/.tools/appimagetool" \
            --arch x86_64
          rm -f "${APPIMAGE}.sig"

      # ── Sign pruned AppImage ───────────────────────────────────────────
      - name: Sign pruned AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          APPIMAGE=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage artifact found" >&2
            exit 1
          fi
          pnpm tauri signer sign "$APPIMAGE"

      # ── Upload to release ──────────────────────────────────────────────
      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # NAS Server — single binary with embedded frontend
  # ═══════════════════════════════════════════════════════════════════════
  build-nas:
    name: NAS ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: tar.gz
            binary: limedl

          - name: linux-aarch64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            ext: tar.gz
            binary: limedl

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
            binary: limedl.exe

          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
            binary: limedl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # ── Frontend build (NAS mode, identical across platforms) ──────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-release-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-release-${{ runner.os }}-

      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build frontend (NAS mode)
        run: pnpm run build:nas

      # ── Rust toolchain ─────────────────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-nas-${{ matrix.target }}

      # ── musl toolchain (Linux only) ────────────────────────────────────
      - name: Install musl target
        if: contains(matrix.target, 'musl')
        run: |
          rustup target add ${{ matrix.target }}
          sudo apt-get update && sudo apt-get install -y musl-tools

      # ── Build server binary (NAS: x86-64-v2 for broad HW compat) ──────
      - name: Build binary
        env:
          # Desktop targets default to x86-64-v3 in config.toml; NAS overrides to v2
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-cpu=x86-64-v2' || '' }}
        run: cargo build --locked --release --target ${{ matrix.target }} --features embed-frontend --manifest-path crates/limedl-server/Cargo.toml

      # ── Package ────────────────────────────────────────────────────────
      - name: Package (Linux / macOS)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NAME="${{ matrix.name }}"
          BINARY="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          ASSET="limedl-nas-v${VERSION}-${NAME}.tar.gz"
          cp "$BINARY" limedl-nas
          tar -czf "$ASSET" limedl-nas
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.VERSION }}"
          $NAME = "${{ matrix.name }}"
          $BINARY = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          $ASSET = "limedl-nas-v${VERSION}-${NAME}.zip"
          Compress-Archive -Path $BINARY -DestinationPath $ASSET
          echo "ASSET=$ASSET" >> $env:GITHUB_ENV

      # ── Upload to release ──────────────────────────────────────────────
      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: ${{ env.ASSET }}
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
