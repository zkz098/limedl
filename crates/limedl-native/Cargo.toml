[package]
name = "limedl-native"
version.workspace = true
description = "Lightweight native desktop UI for limedl based on Slint"
license.workspace = true
edition = "2024"
build = "build.rs"

[[bin]]
name = "limedl-native"
path = "src/main.rs"

[dependencies]
limedl-core = { path = "../limedl-core", features = ["aria2-rpc"] }
slint = { workspace = true, features = ["std", "backend-default", "renderer-skia", "accessibility", "compat-1-2"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
tray-icon = "0.24"
muda = "0.19"
notify-rust = "4"
rfd = "0.16"
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png"] }
sys-locale = "0.3"
reqwest = { workspace = true }
minisign-verify = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
self-replace = "1.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
zip = { version = "8", default-features = false, features = ["deflate"] }
windows = { version = "0.61", features = [
    "Foundation",
    "ApplicationModel",
    "Services_Store",
] }
# windows 0.61 disables windows-future's `std` feature, which is where the
# Future/IntoFuture impls for IAsyncOperation live — re-enable it so the Store
# updater can await async WinRT calls instead of blocking the UI thread.
windows-future = { version = "0.2", default-features = false, features = ["std"] }

[target.'cfg(not(windows))'.dependencies]
flate2 = "1"
tar = "0.4"

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
skia-safe = { version = "0.99", features = ["textlayout"] }
