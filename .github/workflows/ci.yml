name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typescript:
    name: Lint & Type-check (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm exec vue-tsc --noEmit
      - run: pnpm run test

  check-windows:
    name: Check & Clippy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: swatinem/rust-cache@v2
      - name: Enable lld-link
        run: echo "RUSTFLAGS=-C linker=lld-link" >> "$env:GITHUB_ENV"
      - run: cargo clippy --workspace -- -D warnings

  check-rust:
    name: Check, Clippy & Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf mold
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --manifest-path crates/limedl-core/Cargo.toml --features "test-utils,aria2-rpc"
      - run: cargo test --manifest-path crates/limedl-server/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  bench-rust:
    name: Benchmark (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf mold

      - name: Restore main baseline
        uses: actions/cache/restore@v4
        with:
          path: criterion-baseline
          key: criterion-${{ runner.os }}-main-ci

      - name: Link baseline
        run: |
          if [ -d "criterion-baseline" ] && [ "$(ls -A criterion-baseline 2>/dev/null)" ]; then
            mkdir -p src-tauri/target/criterion
            cp -r criterion-baseline/* src-tauri/target/criterion/
          fi

      - name: Run benchmarks
        run: cargo bench --manifest-path src-tauri/Cargo.toml --features test-utils --bench aimd --bench rate_limiter

      - name: Copy results to baseline
        if: github.event_name == 'push'
        run: |
          rm -rf criterion-baseline
          mkdir -p criterion-baseline
          for bench in aimd rate_limiter; do
            if [ -d "src-tauri/target/criterion/$bench" ]; then
              cp -r "src-tauri/target/criterion/$bench" criterion-baseline/
            fi
          done
          if [ -d "src-tauri/target/criterion/report" ]; then
            cp -r src-tauri/target/criterion/report criterion-baseline/
          fi

      - name: Cache baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: criterion-baseline
          key: criterion-${{ runner.os }}-main-ci

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: criterion-baseline/report/

  supply-chain:
    name: Supply Chain (cargo-deny + cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check -W rejected bans licenses sources

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

