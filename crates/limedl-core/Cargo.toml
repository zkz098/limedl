[package]
name = "limedl-core"
version.workspace = true
description = "Core download engine for limedl — HTTP downloads, scheduler, CDN accelerator, etc."
license.workspace = true
edition = "2024"
# Workspace-internal: limedl ships binaries and a container image, never
# crates.io packages. Keeping this explicit is what makes `pub(crate)` -> `pub`
# promotions across the crate split a non-event for semver.
publish = false

[lib]
name = "limedl_core"

[dependencies]
# `default-features = false`: `limedl-types` has no default features on purpose,
# so `limedl-core --no-default-features` really does drop `irontide` from the
# graph.
limedl-types = { path = "../limedl-types", default-features = false }
limedl-disk = { path = "../limedl-disk", default-features = false }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
blake3 = { workspace = true }
xxhash-rust = { workspace = true }
sanitize-filename = { workspace = true }
uuid = { workspace = true }
percent-encoding = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
base64 = { workspace = true }
rusqlite = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
bytes = { workspace = true }
foldhash = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
argon2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
irontide = { workspace = true, optional = true }
open = { workspace = true }
quick-xml = { workspace = true }
# Encoders for the compression test endpoints. Optional and only enabled by
# `test-utils`: the decoder side arrives through reqwest's gzip/brotli/zstd
# features, so these exact versions are already in the graph.
flate2 = { version = "1", optional = true }
brotli = { version = "9", optional = true }
zstd = { version = "0.14", optional = true }

[features]
bt = ["dep:irontide", "limedl-types/bt"]
default = ["bt"]
aria2-rpc = [
    "dep:axum",
    "dep:tower-http",
    "dep:argon2",
    "dep:subtle",
    "bt",
]
test-utils = [
    "dep:axum",
    "dep:tower-http",
    "dep:flate2",
    "dep:brotli",
    "dep:zstd",
    "limedl-disk/test-utils",
]

[dev-dependencies]
# `limedl-disk`'s test seams (`file_ops::fault`, `DownloadBuffer::has_degraded`)
# sit behind its own `test-utils` feature now that the module is a crate. A
# dev-dependency entry is what re-creates the old `cfg(test)` behaviour: Cargo
# unifies features for dev-dependencies, so `cargo test -p limedl-core` turns
# those seams on while a plain build keeps them out.
limedl-disk = { path = "../limedl-disk", default-features = false, features = [
  "test-utils",
] }
tempfile = { workspace = true }
rand = { workspace = true }
ntest = { workspace = true }
tokio-tungstenite = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
criterion = { workspace = true }
# Encoders for the compression test endpoints, needed under `cfg(test)` where
# the optional normal deps above are not enabled. See the `test-utils` feature.
flate2 = "1"
brotli = "9"
zstd = "0.14"

[[bench]]
name = "aimd"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "rate_limiter"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "download_e2e"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "buffer_pool"
harness = false
required-features = ["test-utils"]
