[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[advisories]
yanked = "warn"
unmaintained = "workspace"
ignore = [
  "RUSTSEC-2025-0141", # bincode is unmaintained
  "RUSTSEC-2025-0134", # rustls-pemfile is unmaintained
  "RUSTSEC-2026-0192", # ttf-parser is unmaintained
  "RUSTSEC-2026-0346", # rustls
  "RUSTSEC-2026-0347", # rustls
  "RUSTSEC-2026-0348", # rustls
  "RUSTSEC-2026-0349", # rustls
  "RUSTSEC-2026-0293", # ringbuf
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  # webpki-roots (transitive via reqwest/hyper-rustls) — Mozilla root CA
  # bundle shipped under CDLA-Permissive-2.0 (Community Data License
  # Agreement Permissive 2.0). It's a permissive data/license grant, not
  # copyleft, and is OSI-recognized. Required for TLS validation in
  # HTTP/HTTPS download paths.
  "CDLA-Permissive-2.0",
  # limedl itself is GPL-3.0-or-later (Cargo.toml workspace license +
  # LICENSE file). Slint (i-slint-* and friends) is GPL-3.0-or-later with a
  # license exception, and its virality is acknowledged — limedl as a whole is
  # conveyed under GPL-3.0-or-later. (The BT engine is now librqbit, Apache-2.0;
  # the previously pinned GPL irontide engine is gone from the graph.)
  "GPL-3.0-or-later",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
