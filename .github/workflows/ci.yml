name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typescript:
    name: Lint & Type-check (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run lint
      - run: pnpm exec vue-tsc --noEmit
      - run: pnpm run test:coverage

  e2e-nas-webui:
    name: E2E (nas-webui Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright system dependencies
        run: pnpm exec --ignore-scripts playwright install --with-deps chromium
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: e2e-nas-webui
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf mold
      - name: Build frontend (NAS mode)
        run: pnpm run build:nas
      - name: Build limedl-server
        run: cargo build --locked --release --manifest-path crates/limedl-server/Cargo.toml --bin limedl
      - name: Start limedl-server daemon
        # The daemon process is auto-reaped when the job ends (no explicit shutdown needed)
        run: |
          ./target/release/limedl daemon --user e2e --pass e2epass --port 9090 > server.log 2>&1 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          # Wait for the server to be ready
          for i in {1..30}; do
            if curl -sf -u e2e:e2epass http://localhost:9090/ > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
          curl -sf -u e2e:e2epass http://localhost:9090/ > /dev/null || { echo "Server failed to start"; cat server.log; exit 1; }
      - name: Run E2E tests (nas-webui project)
        run: pnpm run test:e2e:nas
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-nas-webui
          path: playwright-report/
          if-no-files-found: warn
      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: limedl-server-logs
          path: server.log
          if-no-files-found: warn

  check-windows:
    name: Check, Clippy & Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Enable lld-link
        run: echo "RUSTFLAGS=-C linker=lld-link" >> "$env:GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Windows tests: core + server are pure Rust logic (no GUI dep).
      # src-tauri tests are also pure logic (no Tauri runtime needed).
      - run: cargo test --manifest-path crates/limedl-core/Cargo.toml --features "test-utils,aria2-rpc"
      - run: cargo test --manifest-path crates/limedl-server/Cargo.toml
      # Verify the optional `tls` feature compiles — CI otherwise never exercises it.
      - run: cargo check --manifest-path crates/limedl-server/Cargo.toml --features tls
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  check-macos:
    name: Check & Test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      # macOS ships WebKit natively — no apt install needed.
      # All tests in these crates are pure Rust logic tests that
      # do not require a running Tauri runtime or system WebView.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/limedl-core/Cargo.toml --features "test-utils,aria2-rpc"
      - run: cargo test --manifest-path crates/limedl-server/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  check-rust:
    name: Check, Clippy & Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf mold
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-llvm-cov
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check ts-rs bindings are up-to-date
        run: |
          cargo test --manifest-path crates/limedl-core/Cargo.toml --features ts export_typescript_bindings
          git diff --exit-code src/types/generated/ src/lib/ws/generated/
      - name: Run tests with coverage
        run: |
          cargo llvm-cov --manifest-path crates/limedl-core/Cargo.toml --features "test-utils,aria2-rpc" --lcov --output-path lcov-core.info
          cargo llvm-cov --manifest-path crates/limedl-server/Cargo.toml --lcov --output-path lcov-server.info
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --lcov --output-path lcov-tauri.info
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-coverage-lcov
          path: lcov-*.info
          if-no-files-found: warn

  bench-rust:
    name: Benchmark (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf mold

      - name: Restore main baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: criterion-baseline
          key: criterion-${{ runner.os }}-main-ci

      - name: Link baseline
        run: |
          if [ -d "criterion-baseline" ] && [ "$(ls -A criterion-baseline 2>/dev/null)" ]; then
            mkdir -p target/criterion
            cp -r criterion-baseline/* target/criterion/
          fi

      - name: Run benchmarks
        run: cargo bench --manifest-path crates/limedl-core/Cargo.toml --features test-utils --bench aimd --bench rate_limiter

      - name: Copy results to baseline
        if: github.event_name == 'push'
        run: |
          rm -rf criterion-baseline
          mkdir -p criterion-baseline
          for bench in aimd rate_limiter; do
            if [ -d "target/criterion/$bench" ]; then
              cp -r "target/criterion/$bench" criterion-baseline/
            fi
          done
          if [ -d "target/criterion/report" ]; then
            cp -r target/criterion/report criterion-baseline/
          fi

      - name: Cache baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: criterion-baseline
          key: criterion-${{ runner.os }}-main-ci

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: criterion-report
          path: criterion-baseline/report/

  supply-chain:
    name: Supply Chain (cargo-deny + cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-deny
      - run: cargo deny check -W rejected bans licenses sources

      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-audit
      - run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
