# CPU baseline: x86-64-v3 (Haswell, Intel 2013 / Excavator, AMD 2015).
# This app targets modern desktop devices — older hardware is not supported.
# Windows targets use static CRT linking (+crt-static).
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "link-arg=-fuse-ld=mold"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

