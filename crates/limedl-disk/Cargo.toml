[package]
name = "limedl-disk"
version.workspace = true
description = "Disk and I/O substrate for limedl — buffered writes, the chunk buffer pool, HDD/SSD scheduling and the shared disk services"
license.workspace = true
edition = "2024"
# Workspace-internal, like every other limedl crate.
publish = false

[lib]
name = "limedl_disk"

[dependencies]
# The only limedl crate this layer may name. Everything below it lives in
# `limedl-types`; everything above it (the HTTP engine, the BT backend) depends
# on *this* crate, never the other way round — `module_boundaries_tests`
# enforces the same relation inside the engine and `Cargo.toml` enforces it here.
limedl-types = { path = "../limedl-types", default-features = false }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
foldhash = { workspace = true }
async-trait = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Vectored writes and device-number decoding without hand-built `iovec`s. The
# coalesced flush (`file_ops::write_all_vectored_at`) is the hottest write path
# in the engine: `rustix::io::pwritev` takes `IoSlice`s and returns `Errno`, so
# that loop needs no `unsafe` block at all. `fs` is for `major`/`minor`.
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS disk probe needs the *raw* `statfs` struct (`f_mntfromname`,
# `f_fstypename`) to name the mounted BSD device, and `rustix::fs::statfs`
# exposes only the portable fields — so libc stays, scoped to the one platform
# that reads those fields. Linux needs none of it: it resolves the block device
# through `/sys/dev/block/<major>:<minor>`.
libc = { workspace = true }

[features]
# Keeps the deterministic write-fault hooks (`file_ops::fault`) and the
# buffer-pool/queue test seams compiled. `limedl-core` forwards its own
# `test-utils` here, which is why the moved modules keep their
# `cfg(any(test, feature = "test-utils"))` gates unchanged.
default = []
test-utils = []

[dev-dependencies]
divan = { workspace = true }
tempfile = { workspace = true }

# The buffer-pool bench drives `DownloadBuffer::new`, which only exists behind
# `test-utils` (the plain double-buffer constructor is the seam the engine's
# tests use; production goes through the local-pingpong paths). Hence
# `--features test-utils`, and hence `required-features`: without it cargo would
# try to build the bench against a crate where the constructor does not exist.
[[bench]]
name = "buffer_pool"
harness = false
required-features = ["test-utils"]
