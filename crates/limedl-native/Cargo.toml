[package]
name = "limedl-native"
version.workspace = true
description = "Lightweight native desktop UI for limedl based on Slint"
license.workspace = true
edition = "2024"
build = "build.rs"

[[bin]]
name = "limedl-native"
path = "src/main.rs"

[dependencies]
limedl-core = { path = "../limedl-core", features = ["aria2-rpc"] }
slint = { workspace = true, features = [
  "std",
  "backend-default",
  "renderer-skia",
  "accessibility",
  "compat-1-2",
  "raw-window-handle-06",
] }
raw-window-handle = "0.6"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
mimalloc = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
# default-features = false drops `libxdo`, which `tray-icon` enables by default on
# Linux only so `muda`'s predefined `Copy`/`Cut`/`Paste`/`SelectAll` items can
# synthesize keystrokes through `xdotool` (`muda/src/lib.rs:1187`). limedl never
# constructs a predefined item — `build_tray_menu` uses `separator()` only — so
# the feature would cost a `libxdo-dev` build dependency and an `xdotool` runtime
# dependency for code that is never reached. The `gtk` feature stays: it is what
# provides the Linux tray itself (via `libappindicator`, needing `libgtk-3-dev` at
# build time), and it is left implicit through the default set of the *other*
# features, so only the xdo half is switched off here.
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }
# `muda` is a direct dependency (the tray menu items are built from it) AND a
# transitive one through `tray-icon`. Features are unified across the whole graph,
# so `default-features = false, features = ["gtk"]` has to be set on BOTH crates:
# leaving it off here re-enables `libxdo` for the workspace and the `tray-icon`
# entry above would have no effect (this is exactly how `libxdo` survived the
# first attempt). Same reasoning as above — `gtk` is required, `libxdo` is not.
muda = { version = "0.19", default-features = false, features = ["gtk"] }
notify-rust = "4"
# rfd's build script panics when both of its Linux backends (`gtk3` and
# `xdg-portal`) are enabled for the same target, so exactly one has to be picked.
#
# `gtk3` was the historical pin: the retired `src-tauri` crate pulled
# `tauri-plugin-dialog` → `rfd/gtk3` into every workspace build (`cargo clippy
# --workspace`, `cargo llvm-cov`), and Cargo unifies features per package, so this
# crate had to follow or both flags would be on at once. That constraint is gone.
#
# `xdg-portal` is now selected because it removes the *build-time* GTK dependency:
# `gtk3` needs `libgtk-3-dev` + `pkg-config` present to compile (`gtk-sys`), which
# every Linux contributor and CI leg had to install, while `xdg-portal` talks to
# the already-running `xdg-desktop-portal` over D-Bus (ashpd/zbus, pure Rust). It
# also gives the native file chooser on Wayland and inside Flatpak/Snap sandboxes,
# where GTK dialogs either mismatch the desktop or fail outright.
#
# `tokio` is REQUIRED alongside `xdg-portal`, not optional: rfd's `build.rs`
# panics with "One of the `tokio` or `async-std` features must be enabled to use
# `xdg-portal`" when neither is set. `default-features = false` drops both, so
# selecting the backend explicitly means selecting a runtime too. `tokio` is the
# right one here — the app is already `#[tokio::main]` and bootstraps limedl-core
# on that runtime, so `async-std` would link a second reactor.
# (The `.await`-based path is not what runs the dialog: `xdg_desktop_portal.rs`
# drives ashpd through `pollster::block_on`. The feature only picks ashpd's
# executor.)
#
# Trade-off: a bare X11 session with no portal service running falls back to the
# portal's own error — `libgtk-3-dev`-free builds cannot show a GTK dialog. Every
# mainstream desktop (GNOME/KDE/XFCE with xdg-desktop-portal*-gtk installed, which
# ships by default) provides one.
#
# This only affects Linux (gtk/ashpd dependencies live under that target's cfg),
# so Windows and macOS dependency graphs and behaviour are unchanged.
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png"] }
sys-locale = "0.3"
reqwest = { workspace = true }
minisign-verify = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
self-replace = "1.5"
percent-encoding = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
# Windows PE resource embedding (icon, product name). winres is a pure-Rust rc
# generator, but it is only ever used by the `CARGO_CFG_TARGET_OS == windows`
# branch of build.rs — scoping it here keeps it out of the macOS/Linux builds.
winres = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
zip = { version = "8", default-features = false, features = ["deflate"] }
windows = { version = "0.61", features = [
  "Foundation",
  "ApplicationModel",
  "Services_Store",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# windows 0.61 disables windows-future's `std` feature, which is where the
# Future/IntoFuture impls for IAsyncOperation live — re-enable it so the Store
# updater can await async WinRT calls instead of blocking the UI thread.
windows-future = { version = "0.2", default-features = false, features = ["std"] }

[target.'cfg(not(windows))'.dependencies]
flate2 = "1"
tar = "0.4"

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
skia-safe = { version = "0.99", features = ["textlayout"] }

[features]
# Debug-only Skia hinting/font-rendering repro (tests/skia_hint_repro.rs). It
# writes comparison PNGs to the temp dir, asserts nothing useful in CI and pulls
# an extra skia-safe build, so it is opt-in:
#   cargo test -p limedl-native --features skia-hint-repro
skia-hint-repro = []

[[test]]
name = "skia_hint_repro"
path = "tests/skia_hint_repro.rs"
required-features = ["skia-hint-repro"]
