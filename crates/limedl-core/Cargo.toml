[package]
name = "limedl-core"
version.workspace = true
description = "Core download engine for limedl — HTTP downloads, scheduler, CDN accelerator, etc."
license.workspace = true
edition = "2024"

[lib]
name = "limedl_core"

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
xxhash-rust = { workspace = true }
sanitize-filename = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
percent-encoding = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
base64 = { workspace = true }
rusqlite = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
bytes = { workspace = true }
foldhash = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
fs4 = { workspace = true }
rand = { workspace = true, optional = true }
irontide = { workspace = true, optional = true }
libc = { workspace = true }
open = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
bt = ["dep:irontide"]
default = ["bt"]
aria2-rpc = ["dep:axum", "dep:tower-http", "bt"]
test-utils = ["rand", "dep:axum", "dep:tower-http"]
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile = { workspace = true }
rand = { workspace = true }
ntest = { workspace = true }
serde_bytes = { workspace = true }
tokio-tungstenite = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "aimd"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "rate_limiter"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "download_e2e"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "buffer_pool"
harness = false
required-features = ["test-utils"]
