name: Signing check

# Proves the update-channel `sigilup` signing secrets work end to end without
# publishing anything: `sigilup sign` signs a throwaway file with
# `SIGILUP_SIGNING_KEY` (and `SIGILUP_SIGNING_KEY_PASSWORD`), and `sigilup guard`
# verifies the signature against `crates/limedl-native/src/update/sigilup-pins.json`.
# Run it after rotating keys (`sigilup keygen`) or any time releases start failing
# at the "Sign artifacts" step.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-check:
    name: Sign & guard (throwaway file)
    runs-on: ubuntu-latest
    env:
      SIGILUP_SIGNING_KEY: ${{ secrets.SIGILUP_SIGNING_KEY }}
      SIGILUP_SIGNING_KEY_PASSWORD: ${{ secrets.SIGILUP_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Caching follows ci.yml's contract: `cache: false` turns off
      # setup-rust-toolchain's built-in rust-cache (the workflow runs rust-cache
      # explicitly instead), and `rustflags: ""` keeps `.cargo/config.toml`
      # authoritative.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: sign-check
          cache-targets: false

      - name: Sign and verify a throwaway file (sigilup)
        run: |
          cargo install sigilup-cli --version 0.1.0 --locked
          if [[ "${SIGILUP_SIGNING_KEY}" =~ ^[[:space:]]*\{ ]]; then
            printf '%s' "${SIGILUP_SIGNING_KEY}" > "${RUNNER_TEMP}/sigilup.sk.json"
            export SIGILUP_SIGNING_KEY="${RUNNER_TEMP}/sigilup.sk.json"
          elif [[ ! "${SIGILUP_SIGNING_KEY}" =~ ^sigilup-sk:v2: && ! -f "${SIGILUP_SIGNING_KEY}" ]]; then
            if decoded="$(printf '%s' "${SIGILUP_SIGNING_KEY}" | base64 -d 2>/dev/null)" && [[ "${decoded}" =~ ^[[:space:]]*(\{|sigilup-sk:v2:) ]]; then
              printf '%s' "${decoded}" > "${RUNNER_TEMP}/sigilup.sk.key"
              export SIGILUP_SIGNING_KEY="${RUNNER_TEMP}/sigilup.sk.key"
            fi
          fi
          sigilup sign README.md
          sigilup guard --pins crates/limedl-native/src/update/sigilup-pins.json README.md
