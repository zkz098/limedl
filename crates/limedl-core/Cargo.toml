[package]
name = "limedl-core"
version.workspace = true
description = "Core download engine for limedl — HTTP downloads, scheduler, CDN accelerator, etc."
license.workspace = true
edition = "2024"
# Workspace-internal: limedl ships binaries and a container image, never
# crates.io packages. Keeping this explicit is what makes `pub(crate)` -> `pub`
# promotions across the crate split a non-event for semver.
publish = false

[lib]
name = "limedl_core"

[dependencies]
# `default-features = false`: `limedl-types` has no default features on purpose,
# so `limedl-core --no-default-features` really does drop `irontide` from the
# graph.
limedl-types = { path = "../limedl-types", default-features = false }
limedl-disk = { path = "../limedl-disk", default-features = false }
limedl-http = { path = "../limedl-http", default-features = false }
limedl-engine = { path = "../limedl-engine", default-features = false }
# The harness is test-only; the optional entry is what the `test-utils` feature
# turns on, and the dev-dependency below is what `cfg(test)` alone gets.
limedl-testkit = { path = "../limedl-testkit", optional = true }
# `testing::make_manager` hands back a TempDir guard, and that module is
# reachable from `--features test-utils` (not just `cfg(test)`), where
# dev-dependencies are not linked.
tempfile = { workspace = true, optional = true }
limedl-bt = { path = "../limedl-bt", default-features = false, optional = true }
limedl-store = { path = "../limedl-store", default-features = false }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
sanitize-filename = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
async-trait = { workspace = true }
bytes = { workspace = true }
foldhash = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
open = { workspace = true }

[features]
bt = ["dep:limedl-bt", "limedl-types/bt", "limedl-store/bt"]
default = ["bt"]
test-utils = [
    "dep:limedl-testkit",
    "dep:tempfile",
    "limedl-disk/test-utils",
    "limedl-store/test-utils",
    "limedl-http/test-utils",
    "limedl-engine/test-utils",
]

[dev-dependencies]
# `limedl-disk`'s test seams (`file_ops::fault`, `DownloadBuffer::has_degraded`)
# sit behind its own `test-utils` feature now that the module is a crate. A
# dev-dependency entry is what re-creates the old `cfg(test)` behaviour: Cargo
# unifies features for dev-dependencies, so `cargo test -p limedl-core` turns
# those seams on while a plain build keeps them out.
limedl-disk = { path = "../limedl-disk", default-features = false, features = [
  "test-utils",
] }
limedl-store = { path = "../limedl-store", default-features = false, features = [
  "test-utils",
] }
limedl-http = { path = "../limedl-http", default-features = false, features = [
  "test-utils",
] }
limedl-engine = { path = "../limedl-engine", default-features = false, features = [
  "test-utils",
] }
limedl-testkit = { path = "../limedl-testkit" }
# The engine's own tests stand up ad-hoc HTTP servers (mirror/abuse/error
# injection) that the shared `TestServer` does not cover.
axum = { workspace = true }

tempfile = { workspace = true }
rand = { workspace = true }
ntest = { workspace = true }
criterion = { workspace = true }
# Encoders for the compression test endpoints, needed under `cfg(test)` where
# the optional normal deps above are not enabled. See the `test-utils` feature.

[[bench]]
name = "aimd"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "rate_limiter"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "download_e2e"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "buffer_pool"
harness = false
required-features = ["test-utils"]
