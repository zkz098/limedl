name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
            tauri-args: ""

          - runner: ubuntu-22.04
            target: linux-x64
            tauri-args: ""

          - runner: macos-latest
            target: apple-aarch64
            tauri-args: "--target aarch64-apple-darwin"

    steps:
      - uses: actions/checkout@v4

      # ── Platform dependencies ──────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            mold
          # libappindicator3-dev was dropped in Ubuntu 24.04; ayatana is the successor
          sudo apt-get install -y libappindicator3-dev 2>/dev/null \
            || sudo apt-get install -y libayatana-appindicator3-dev

      # ── pnpm ──────────────────────────────────────────────────
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ── Rust ───────────────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-apple-darwin"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      # ── macOS code signing ──────────────────────────────────────
      # Only sets APPLE_* env vars when the certificate secret is actually present.
      # When absent, defaults to ad-hoc signing. This prevents the Tauri bundler
      # from importing an empty certificate (which would fail with SecKeychainItemImport).
      - name: Configure macOS code signing
        if: matrix.target == 'apple-aarch64'
        shell: bash
        run: |
          if [ -n "$CERT" ]; then
            echo "APPLE_CERTIFICATE=$CERT" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASS" >> "$GITHUB_ENV"
            [ -n "$SIGN_ID" ] && echo "APPLE_SIGNING_IDENTITY=$SIGN_ID" >> "$GITHUB_ENV"
            [ -n "$APPLE_ID_VAL" ] && echo "APPLE_ID=$APPLE_ID_VAL" >> "$GITHUB_ENV"
            [ -n "$TEAM_ID" ] && echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
            [ -n "$APPLE_PASS" ] && echo "APPLE_PASSWORD=$APPLE_PASS" >> "$GITHUB_ENV"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
        env:
          SIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID_VAL: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASS: ${{ secrets.APPLE_PASSWORD }}

      # ── Build & Release ────────────────────────────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Create release only for tag pushes; manual dispatch builds without release
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Flareget ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'snapshot' }}"
          releaseBody: |
            ## Flareget ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'snapshot' }}

            ### Downloads

            | Platform | File |
            |---|---|
            | Windows x64 | `.msi` / `.exe` installer |
            | Linux x64 | `.deb` / `.AppImage` package |
            | macOS Apple Silicon | `.dmg` disk image |

            ### Changes
            See the [changelog](https://github.com/${{ github.repository }}/releases) for details.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          uploadUpdaterJson: true
          args: ${{ matrix.tauri-args }}
