name: CI

on:
  push:
    branches: [main]
    # Docs-only edits do not need any runners — skip the whole workflow.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  # Validate workflow changes on a branch without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read

# A superseded run only reports on stale code: cancel it so the newest commit
# gets the runners (and the cache write slots) instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ═══════════════════════════════════════════════════════════════════════════
# Caching / RUSTFLAGS contract — read before editing a job below.
#
# `actions-rust-lang/setup-rust-toolchain` runs swatinem/rust-cache internally
# (`cache: true` is its default). Every job here therefore passes `cache: false`
# and runs `swatinem/rust-cache` explicitly exactly once. Doing both stored two
# ~1-2 GB entries per job (~10 GB in total, GitHub's per-repo ceiling) and the
# resulting LRU evictions are what turned every tagged release into a cold
# 16-minute rebuild of Slint/Skia: the release caches never survived.
#
# Job-scoped keys were the other half of that problem. rust-cache's default key
# embeds the job id, so `check-windows`, `test-windows-core` and
# `test-windows-native` each kept a private 0.4-1.3 GB copy of the same
# dependency graph — their env and lockfile hashes are byte-identical (measured
# `fc9b2beb`/`b0be5515` in run 37110796328), only the job name differed. The
# duplicates pushed the repository to 11.7 GB against GitHub's 10 GB ceiling,
# and the LRU eviction that followed deleted every Linux entry, `check-rust`
# included — so the coverage leg rebuilt the llvm-cov workspace cold.
#
# The Rust jobs now share one `ci-debug` key per OS: `shared-key` replaces the
# job-id portion, and rust-cache still appends the runner OS/arch, so Windows,
# Linux and macOS keep separate entries. Contract for every shared cache key:
# - Exactly one job writes a shared key; the others pass `save-if: false`.
#   Several writers would race in `saveCache` after each lockfile bump
#   (actions/cache reserves a key once) and recreate one duplicate generation
#   per job. Writers today: test-windows-native (Windows), check-rust (Linux),
#   check-macos (macOS).
# - Every writer also gates on `github.ref == 'refs/heads/main'`: a cache saved
#   on a PR branch is scoped to that branch and still counts against the same
#   10 GB ceiling.
#
# `rustflags: ""` leaves RUSTFLAGS unset so `.cargo/config.toml` stays the single
# source of truth for codegen/linker flags (x86-64-v3, and rust-lld +
# /FORCE:MULTIPLE on Windows). The action's old default (`RUSTFLAGS=-D warnings`)
# *replaced* the config file's flags for every Rust step; the two Windows-only
# overrides that existed to compensate (`-C linker=lld-link`, then `-D warnings`
# on the native test step) changed the build fingerprint three times in one job
# and rebuilt the whole Skia/winit graph on each switch.
#
# Warnings are still fatal: `CARGO_BUILD_WARNINGS: deny` (cargo's own
# `build.warnings`, orthogonal to RUSTFLAGS) plus clippy's `-- -D warnings`. It is
# set per job, *not* workflow-wide: cargo denies linker warnings too, and linking
# the Skia-based limedl-native with rust-lld legitimately warns about Skia's
# duplicate ICU symbols (`ubrk_getLocaleByType`, fixed by /FORCE:MULTIPLE) — so
# `test-windows-native` keeps its build warnings visible but not fatal, and the
# workspace clippy in `check-windows` remains the Windows lint gate.
#
# Windows-only steps (every Windows job):
# - Windows Defender's real-time scanner inspects every file cargo writes into
#   target/ (multi-GB per run) and is the dominant Windows-vs-Linux penalty we
#   can remove for free. The exclusions are best-effort — a runner policy change
#   must not fail the job — so failures are swallowed and only the resulting
#   protection state is logged.
#
# Test execution:
# - Tests run under `cargo nextest` (pinned through taiki-e/install-action):
#   nextest executes each test in its own process, which parallelizes execution
#   and removes the cross-test global-state interference a single libtest
#   process per binary used to expose (see openwiki/testing/testing-strategy.md). The coverage runs
#   use `cargo llvm-cov nextest` for the same reason, with `--no-fail-fast` so
#   one failing test cannot shorten the coverage union. `cargo nextest run`
#   does not run doctests — the workspace has none today; if a doctest is ever
#   added, add a `cargo test --doc` step to check-rust.
# ═══════════════════════════════════════════════════════════════════════════

jobs:

  # ═══════════════════════════════════════════════════════════════════════
  # MiSans VF font — one fetcher for the whole run.
  #
  # The font is embedded at compile time and cannot be committed (MiSans
  # license). Every job that compiles the UI crate used to run its own
  # cache+download pair, so a cold cache meant four runners hitting Xiaomi's CDN
  # simultaneously — which is exactly how the 2026-10-01 CDN outage turned into
  # four red legs, two of them failing in a way that read like a test failure.
  # Now the CDN is hit once, from one place, and everyone else takes the 20 MB
  # artifact (the cache stays as the first-level shortcut). A font failure is
  # then one clearly named red job instead of a mystery in each leg.
  # ═══════════════════════════════════════════════════════════════════════
  font:
    name: MiSans VF font
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # `fetch-font` is part of xtask now, so the one job that talks to Xiaomi's
      # CDN needs the Rust toolchain. No rust-cache here on purpose: it would
      # only cache the registry for the single xtask binary this job builds.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""
      - uses: ./.github/actions/fetch-misans
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: misans-vf
          path: crates/limedl-native/assets/fonts/MiSansVF.ttf
          retention-days: 1
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════
  # Windows — three parallel jobs instead of one serial chain.
  #
  # Windows is the slowest platform and therefore CI's critical path. clippy is
  # check-only and cannot share artifacts with the test builds, so running it in
  # the same job only serialized the wall clock. The jobs are split so that
  # clippy, the limedl-core + xtask tests, and the native tests each run in
  # parallel (measured job times on warm caches: 272 s / 298 s / 1012 s).
  #
  # That 1012 s is *not* test execution: the 114 tests run in ~3 s (measured on
  # a 16-core dev box, where compile + link is 115 s of the same wall clock).
  # It is the build plus the rust-cache *save* step — 514 s for that job's
  # 846 MB entry, against 35 s for limedl-core's 451 MB one. Shrinking what gets
  # written (or not re-writing it when nothing but the lockfile hash moved)
  # buys more here than moving tests between platforms: `cargo nextest run -p
  # limedl-native` is exactly what `check-rust` (Linux) now runs too, and the
  # suite is just as cheap there.
  # ═══════════════════════════════════════════════════════════════════════
  check-windows:
    name: Clippy (Windows)
    runs-on: windows-latest
    needs: font
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Windows Defender's real-time scanner inspects every file cargo writes
      # into target/ (multi-GB per run) — the dominant Windows-vs-Linux penalty
      # we can remove for free. Best-effort: a runner policy change must not fail
      # the job, so failures are swallowed and only the resulting state is logged.
      - name: Exclude build paths from Defender real-time scanning
        shell: pwsh
        run: |
          foreach ($path in @($env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", $env:RUNNER_TEMP)) {
            Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
          }
          if ($status = Get-MpComputerStatus -ErrorAction SilentlyContinue) {
            Write-Host "Defender real-time protection enabled: $($status.RealTimeProtectionEnabled)"
          }
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: clippy
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          # Shares one Windows debug entry with test-windows-core and
          # test-windows-native (writer contract at the top).
          shared-key: ci-debug
          save-if: false
      - name: Restore bundled MiSans VF font
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: misans-vf
          path: crates/limedl-native/assets/fonts/
      - uses: ./.github/actions/fetch-misans
        with:
          mode: verify
      # Windows-only cfg code (`tray`, updater, winreg, file locking) is linted
      # here and nowhere else, so this stays a full workspace clippy.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-windows-core:
    name: Tests (Windows, limedl-core + xtask)
    runs-on: windows-latest
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Exclude build paths from Defender real-time scanning
        shell: pwsh
        run: |
          foreach ($path in @($env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", $env:RUNNER_TEMP)) {
            Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
          }
          if ($status = Get-MpComputerStatus -ErrorAction SilentlyContinue) {
            Write-Host "Defender real-time protection enabled: $($status.RealTimeProtectionEnabled)"
          }
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          # Restore-only reader of test-windows-native's shared Windows entry
          # (writer contract at the top).
          shared-key: ci-debug
          save-if: false
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: nextest@0.9.144
      # The Windows branches of limedl-core (platform.rs, settings.rs,
      # file_ops/{mod,disk_detect}.rs) only run here — check-rust covers the same
      # test suite on Linux, but compiles the unix branches. Deliberately no
      # MiSans font step: `-p limedl-core` never builds the UI crate.
      - run: cargo nextest run --manifest-path crates/limedl-core/Cargo.toml --features "test-utils,aria2-rpc"
      # xtask rides along: it needs neither the font nor the UI crate, and its
      # tests are the only coverage of the release guard's default `--update-rs`
      # path. `release.yml` calls `cargo xtask guard <files>` with no flag, so a
      # module split that moves that file used to break the release instead of a
      # test (v0.3.15: the manifest job failed after the platform builds).
      - run: cargo nextest run --manifest-path xtask/Cargo.toml

  test-windows-native:
    name: Tests (Windows, limedl-native)
    runs-on: windows-latest
    needs: font
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Exclude build paths from Defender real-time scanning
        shell: pwsh
        run: |
          foreach ($path in @($env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", $env:RUNNER_TEMP)) {
            Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
          }
          if ($status = Get-MpComputerStatus -ErrorAction SilentlyContinue) {
            Write-Host "Defender real-time protection enabled: $($status.RealTimeProtectionEnabled)"
          }
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          # The single writer of the Windows `ci-debug` entry: this job compiles
          # the largest dependency superset (limedl-core's graph plus Slint), so
          # check-windows and test-windows-core reuse its artifacts. Main-only
          # saves keep PR branches out of the 10 GB ceiling (writer contract at
          # the top).
          shared-key: ci-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: nextest@0.9.144
      - name: Restore bundled MiSans VF font
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: misans-vf
          path: crates/limedl-native/assets/fonts/
      - uses: ./.github/actions/fetch-misans
        with:
          mode: verify
      # limedl-native: pure logic tests (UI form mapping, i18n, batching, updater
      # manifest parsing) plus the in-process UI suite. All three platforms run
      # this suite (check-macos and check-rust included) and that is the point —
      # the same assertions on another OS catch path, file-locking and temp-dir
      # differences. This job is the only place the `cfg(windows)` branches
      # (registry autostart, named-mutex single instance, DWM, PE resources)
      # execute, so it stays a full test run and the suite is never pruned to
      # "Windows-only tests": execution is 3 s of the step, the build is the rest.
      - run: cargo nextest run --manifest-path crates/limedl-native/Cargo.toml

  check-macos:
    name: Clippy & tests (macOS)
    runs-on: macos-14
    needs: font
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: clippy
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          # The only macOS Rust job, so it is its own writer. `shared-key` keeps
          # the name aligned with the other OSes' entries (rust-cache appends
          # the OS/arch, so they never collide) and main-only saves keep PR
          # branches out of the ceiling.
          shared-key: ci-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: nextest@0.9.144
      # macOS ships WebKit natively — no apt install needed.
      - name: Restore bundled MiSans VF font
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: misans-vf
          path: crates/limedl-native/assets/fonts/
      - uses: ./.github/actions/fetch-misans
        with:
          mode: verify
      # `cfg(target_os = "macos")` code lives in limedl-core (platform, disk
      # detect, io topology) as well as the UI crate, so this stays a full
      # workspace clippy. On top of compiling the `cfg(not(windows))` branches,
      # clippy runs rfd's build script — the check that caught a missing
      # `tokio`/`async-std` runtime feature for xdg-portal, which cannot fire on
      # the Windows legs. All tests in these crates are pure Rust logic tests
      # that do not require a display server.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --manifest-path crates/limedl-core/Cargo.toml --features "test-utils,aria2-rpc"
      # limedl-native's `cfg(target_os = "macos")` tests (the tar.gz/`.app` member
      # match and the window-placement guard) exist only here: test-windows-native
      # compiles the Windows branches and check-rust the Linux ones, so without
      # this line macOS-specific code would be linted but never executed.
      - run: cargo nextest run --manifest-path crates/limedl-native/Cargo.toml

  check-rust:
    name: Clippy, tests & coverage (Linux)
    runs-on: ubuntu-latest
    needs: font
    env:
      CARGO_BUILD_WARNINGS: deny
      # Guard for the two SonarQube steps below: GitHub withholds secrets from
      # Dependabot and fork pull requests, so the scan is skipped there instead
      # of failing the leg. Kept as a separate flag so the token itself stays
      # scoped to the steps that use it rather than the whole job.
      SONAR_ENABLED: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      # Full history: the scanner attributes new lines to commits through SCM
      # blame, and a shallow clone degrades the relevance of `new code`. The
      # repository is 13 MB, so the deeper clone costs nothing measurable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: clippy
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          # The Linux `ci-debug` entry (writer contract at the top). check-rust
          # is the only Linux Rust job that builds the workspace, so it is its
          # own writer; the key is shared for consistency with the other OSes.
          shared-key: ci-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Slint's font stack probes pkg-config for fontconfig
      # (`yeslogic-fontconfig-sys`); the tray no longer needs any GTK package.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      # Pinned, not `cargo-llvm-cov@latest`: the 0.6.21 -> 0.9.0 jump changed the
      # default ignore regex (test files dropped from the report), which silently
      # re-baselined the `--fail-under-lines` metric and turned the gate red
      # without a code change. Pin `nextest` for the same reason.
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-llvm-cov@0.9.0
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: nextest@0.9.144
      # limedl-native embeds MiSans VF at compile time; the font arrives as an
      # artifact from the `font` job (see its comment).
      - name: Restore bundled MiSans VF font
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: misans-vf
          path: crates/limedl-native/assets/fonts/
      - uses: ./.github/actions/fetch-misans
        with:
          mode: verify
      # Coverage runs before the lint step, and that order is a contract with the
      # scan further down: llvm-cov instruments the build (RUSTFLAGS), so the
      # report has to be produced before something rebuilds the workspace
      # uninstrumented. The other way round the scan costs a third full build of
      # the workspace, and it needs the report to already exist.
      #
      # The report lands inside the crate it describes: the Rust analyzer splits
      # the workspace into one module per Cargo manifest and resolves
      # sonar.rust.lcov.reportPaths relative to each module's base dir, so a copy
      # at the repository root is never found (verified in the 2026-10-02 run:
      # "No LCOV report files found" for all three crates).
      - name: Run tests with coverage
        run: |
          # `--cargo-profile dev` keeps line tables for source attribution: the
          # test profile drops debug info (see Cargo.toml) to cut CI link time.
          # (`--profile` would select a *nextest* profile; the Cargo build
          # profile is nextest's `--cargo-profile`.) `--no-fail-fast` keeps the
          # coverage union complete when a test fails — nextest otherwise
          # cancels the remaining tests, unlike the libtest default it replaced.
          #
          # `--fail-under-lines` is this repo's only hard coverage gate. Sonar's
          # quality gate stays advisory because the Free plan cannot attach the
          # prepared custom condition to the project (see
          # sonar-project.properties), so without this flag the number could
          # silently rot. 85 is the pinned-0.9.0 Linux measurement (86.90% of
          # 15376 product lines, run 37088319623 on 2026-10-03) minus ~2 pp of
          # margin. The margin is for the numerator, not for a future tool
          # move: the covered-line count wobbles by ~20 lines between runs (CI
          # 13362, local 13343) because timing-dependent paths (retry/backoff,
          # eviction) are not deterministic under the instrumented build.
          #
          # "Product-only" is what the tool has always measured for the gate:
          # since cargo-llvm-cov 0.6.22 the default ignore regex drops `tests/`
          # directories and `tests.rs`/`*_tests.rs` files, so test code is not
          # in the denominator (Sonar excludes it too).
          #
          # Do not re-baseline this number from a local run alone. The 87 this
          # gate originally shipped with was "87.37% of 14561 lines", and 14561
          # is the *0.6.21* report, not 0.9.0's: 0.6.x injected
          # `-C instrument-coverage` into the whole graph via RUSTFLAGS, while
          # 0.7.0+ applies it only to the crates that need it through a rustc
          # wrapper (PR #471). A fresh 0.6.21 build reproduces 14561; a fresh
          # 0.9.0 build of the same tree measures 15376, and the wrapper's flags
          # are invisible to cargo's fingerprints, so a re-check run after a
          # 0.6.21 build can silently report the old artifacts. Measure from
          # `cargo llvm-cov clean` with the pinned tool, or trust the number CI
          # prints. Ratchet the gate up when the measured value grows; lowering
          # it again needs the same clean-run evidence.
          #
          # Coverage stays on stable: cargo-llvm-cov's `--branch` is unstable
          # and refuses to run on a stable toolchain, so this is line coverage
          # only (Sonar therefore reports no condition coverage either).
          #
          # `--no-cfg-coverage` matters for two reasons. It is required for the
          # native run below (see there), and passing it here too keeps both
          # runs' RUSTFLAGS identical so the second reuses the instrumented
          # artifacts the first just built instead of rebuilding every shared
          # dependency. It only drops cargo-llvm-cov's `--cfg coverage`; the
          # `-C instrument-coverage` instrumentation is unaffected, and neither
          # this repo nor core's dependency graph uses that cfg (measured
          # difference: 5 dependency lines).
          cargo llvm-cov nextest --cargo-profile dev --no-fail-fast --manifest-path crates/limedl-core/Cargo.toml --features "test-utils,aria2-rpc" --lcov --output-path crates/limedl-core/lcov-core.info --fail-under-lines 85 --no-cfg-coverage
          # Second report for the Sonar scan: the desktop crate is a workspace
          # path dependency of limedl-core's *sibling*, so without it every
          # limedl-native line was missing from the report and Sonar counted the
          # crate as 0% (it is now imported instead of excluded, see
          # sonar-project.properties). `--ignore-filename-regex` drops
          # limedl-core from this report: llvm-cov instruments the whole build,
          # and a second copy of core's lines would otherwise be imported next to
          # lcov-core.info. The regex uses `.` so it matches both path
          # separators.
          #
          # `--no-cfg-coverage` is load-bearing on stable: without it
          # cargo-llvm-cov passes `--cfg coverage`, and `tiny-xlib` (a
          # limedl-native-only transitive dependency) turns that into
          # `#![feature(coverage_attribute)]`, which stable rustc rejects
          # (`E0554`).
          #
          # The report measures 73.7% (8855/12021 lines) under the pinned tool
          # and the nextest runner (CI-equivalent local run, 2026-10-03). There
          # is no --fail-under-lines here yet: land a baseline gate once the
          # number has settled in CI.
          cargo llvm-cov nextest --cargo-profile dev --no-fail-fast --manifest-path crates/limedl-native/Cargo.toml --lcov --output-path crates/limedl-native/lcov-native.info --ignore-filename-regex 'crates.limedl-core' --no-cfg-coverage
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # ── SonarQube Cloud ────────────────────────────────────────────────
      # Rust is not available in Automatic Analysis, so the analysis runs from
      # here (configuration: sonar-project.properties). It sits directly after
      # the lint step on purpose: the Rust analyzer spawns `cargo clippy` itself,
      # so it reuses the artifacts that step has just built and runs against a
      # tree that already passed `- D warnings`. It also imports the llvm-cov
      # report produced above, which is why that step had to move up here.
      - name: Cache SonarQube packages
        if: env.SONAR_ENABLED == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      # `build.warnings = deny` stays job-wide (it is what makes the lint step
      # fatal). The analyzer treats a clippy failure as a warning and would then
      # publish metrics without clippy issues, so it is relaxed for this step
      # only: anything that matters already failed the step above.
      - name: SonarCloud scan
        if: env.SONAR_ENABLED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          CARGO_BUILD_WARNINGS: warn
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
      # limedl-native runs here as well: its suite is platform-agnostic logic
      # plus the in-process UI tests (Slint's testing backend needs no display),
      # and this is the only leg that *executes* the `cfg(target_os = "linux")`
      # branches (`.desktop` autostart, the tray failure message, xdg-open, the
      # AppImage self-update guard). It deliberately rides in this job instead of
      # getting its own: this job's 242 s is nowhere near the critical path
      # (test-windows-native, ~1012 s), so a separate leg would only add
      # scheduling overhead — see the Windows section above.
      - run: cargo nextest run --manifest-path crates/limedl-native/Cargo.toml
      # limedl-server is the headless daemon. Its suite includes one end-to-end
      # test that binds a real port and bootstraps the engine, so it exercises
      # the bootstrap → forced-enabled RPC → `aria2.shutdown` → engine-shutdown
      # wiring that the core's `aria2_rpc` tests never run. It is Linux-only on
      # purpose: the daemon targets musl Linux, so the Windows/macOS legs only
      # need to *compile* it — which the workspace clippy step already does via
      # `--all-targets`.
      - run: cargo nextest run --manifest-path crates/limedl-server/Cargo.toml
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-coverage-lcov
          # Recursive: the report is written next to the crate it covers.
          path: '**/lcov-*.info'
          if-no-files-found: warn

  supply-chain:
    name: Supply chain (cargo-deny, cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          # These tools never compile the workspace — the registry is all they need.
          cache-targets: false
          # Its env hash differs from check-rust's (this job sets no
          # CARGO_BUILD_WARNINGS), so it keeps its own small registry entry;
          # still main-only.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-deny
      - run: cargo deny check -W rejected bans licenses sources

      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-audit
      - run: cargo audit
