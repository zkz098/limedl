# limedl build configuration
# See AGENTS.md for the MSVC environment setup required before building on Windows.
#
# Target CPU strategy:
#   Desktop targets (Tauri app) → x86-64-v3 (Haswell 2013+)
#   NAS server targets (musl)    → x86-64-v2 (Nehalem 2008+, broad NAS HW compat)

[target.x86_64-pc-windows-msvc]
# Desktop: x86-64-v3 for modern performance
# Use rust-lld linker (faster than MSVC link.exe)
# Skia (via i-slint-renderer-skia) bundles ICU (skunicode_icu.lib) which duplicates
# symbols from windows-rs ICU shims (icuuc). LLD defaults to error on duplicates;
# /FORCE:MULTIPLE allows the first definition to win (Skia's ICU) and fixes:
#   duplicate symbol: ubrk_getLocaleByType / ures_getByKey / uloc_getName ...
# See: slint skia + windows crate ICU clash on Windows.
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "linker=rust-lld", "-C", "link-arg=/FORCE:MULTIPLE"]

[target.x86_64-unknown-linux-gnu]
# Desktop / CI tests: x86-64-v3
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-unknown-linux-musl]
# NAS server: x86-64-v2 for broad NAS hardware compatibility
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.aarch64-unknown-linux-musl]
# NAS server (ARM): no x86 CPU flag needed

[target.aarch64-apple-darwin]
# Desktop macOS ARM: apple-m1 baseline
rustflags = ["-C", "target-cpu=apple-m1"]

[target.x86_64-apple-darwin]
# Desktop macOS x86_64: x86-64-v3
rustflags = ["-C", "target-cpu=x86-64-v3"]
