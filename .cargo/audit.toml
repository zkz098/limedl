    "RUSTSEC-2025-0134", # rustls-pemfile is unmaintained
    "RUSTSEC-2026-0192", # ttf-parser is unmaintained
    # Fixed via crate updates; keep ignored for safety across cache restores
    "RUSTSEC-2026-0346", # rustls
    "RUSTSEC-2026-0347", # rustls
    "RUSTSEC-2026-0348", # rustls
    "RUSTSEC-2026-0349", # rustls
    "RUSTSEC-2026-0367", # zip
    "RUSTSEC-2026-0368", # zip
    "RUSTSEC-2026-0369", # zip
]
