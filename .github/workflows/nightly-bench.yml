name: Nightly Benchmarks

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch: # Manual trigger

jobs:
  e2e-bench:
    name: E2E Download Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Restore main baseline
        uses: actions/cache/restore@v6
        with:
          path: criterion-baseline
          key: criterion-${{ runner.os }}-main-e2e

      - name: Link baseline
        run: |
          if [ -d "criterion-baseline" ] && [ "$(ls -A criterion-baseline 2>/dev/null)" ]; then
            mkdir -p src-tauri/target/criterion
            cp -r criterion-baseline/* src-tauri/target/criterion/
          fi

      - name: Run E2E benchmarks
        run: cargo bench --manifest-path src-tauri/Cargo.toml --features test-utils --bench download_e2e

      - name: Copy results to baseline
        run: |
          rm -rf criterion-baseline
          mkdir -p criterion-baseline
          if [ -d "src-tauri/target/criterion/download_e2e" ]; then
            cp -r src-tauri/target/criterion/download_e2e criterion-baseline/
          fi
          if [ -d "src-tauri/target/criterion/report" ]; then
            cp -r src-tauri/target/criterion/report criterion-baseline/
          fi

      - name: Cache baseline
        uses: actions/cache/save@v6
        with:
          path: criterion-baseline
          key: criterion-${{ runner.os }}-main-e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-bench-report
          path: criterion-baseline/report/
