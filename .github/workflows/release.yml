name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Changelog — generate GitHub release notes from Conventional Commits
  # between the previous tag and the released tag (via git-cliff + cliff.toml).
  # The body is exposed as a job output consumed by the upload steps below.
  # ═══════════════════════════════════════════════════════════════════════
  changelog:
    name: Generate release notes
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history + tags so git-cliff can diff the previous release range.
          fetch-depth: 0
          fetch-tags: true

      - name: Compute previous tag
        id: prev
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          PREV="$(git tag --sort=-v:refname | grep -vx "v${VERSION}" | head -n1 || true)"
          echo "PREV=${PREV:-}" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: git-cliff

      - name: Generate release notes
        id: changelog
        shell: bash
        run: |
          RANGE=""
          if [ -n "${{ steps.prev.outputs.PREV }}" ]; then
            RANGE="${{ steps.prev.outputs.PREV }}..${{ github.ref_name }}"
          fi
          BODY="$(git-cliff --config cliff.toml --strip header $RANGE 2>/dev/null || true)"
          if [ -z "$BODY" ]; then
            echo "git-cliff produced an empty changelog." >&2
            BODY="No changelog entries for ${{ github.ref_name }}."
          fi
          echo "=== Generated release notes ==="
          echo "$BODY"
          {
            echo 'body<<GCLIFF_EOF'
            echo "$BODY"
            echo 'GCLIFF_EOF'
          } >> "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════════════════════════════════
  # Tauri Desktop — platform-specific bundles (MSI, DMG, deb, AppImage)
  # ═══════════════════════════════════════════════════════════════════════
  build-tauri:
    name: Tauri ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: changelog
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest

          - name: macos-universal
            os: macos-latest
            tauri-args: --target universal-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # ── Node.js & frontend deps ────────────────────────────────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-release-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-release-${{ runner.os }}-

      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # ── Rust toolchain ─────────────────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-tauri-${{ matrix.name }}

      # ── Linux system deps (Tauri requires WebKit) ──────────────────────
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ── macOS universal: add x86_64 target for cross-compilation ──────
      - name: Add macOS x86_64 target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      # ── Build Tauri ────────────────────────────────────────────────────
      - name: Build Tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "v${{ steps.version.outputs.VERSION }}"
          releaseBody: ${{ needs.changelog.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.tauri-args || '' }}

  # ═══════════════════════════════════════════════════════════════════════
  # Native Desktop (Slint) — portable zip + NSIS installer + MSIX package.
  # All artifacts are minisign-signed with the shared updater key so the
  # native self-updater (latest-native.json) can verify downloads.
  # ═══════════════════════════════════════════════════════════════════════
  build-native:
    name: Native windows-x86_64
    runs-on: windows-latest
    needs: changelog
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # ── Rust toolchain ─────────────────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-native-windows-x86_64

      # ── MiSans VF (embedded at compile time; not in git) ─────────────
      - name: Fetch MiSans VF font
        shell: pwsh
        run: pwsh scripts/fetch-misans.ps1

      - name: Build limedl-native
        shell: pwsh
        run: cargo build --locked --release -p limedl-native

      # ── Node for the tauri CLI (signer) ────────────────────────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      # ── Assemble dist/ ──────────────────────────────────────────────────
      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/limedl-native.exe dist/

      # ── Portable zip ────────────────────────────────────────────────────
      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $out = "dist/limedl-native-v$version-windows-x86_64-portable.zip"
          Compress-Archive -Path dist/limedl-native.exe -DestinationPath $out
          Write-Host "wrote $out"

      # ── NSIS installer ─────────────────────────────────────────────────
      - name: Package NSIS installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          choco install nsis -y --no-progress
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "makensis not found" }
          & $makensis "/DVERSION=$version" "/DOUTFILE=dist\limedl-native-v$version-windows-x86_64-setup.exe" installer\limedl-native.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }

      # ── MSIX package ────────────────────────────────────────────────────
      - name: Package MSIX
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $ErrorActionPreference = "Stop"

          $staging = "packaging/msix/staging"
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Force -Path "$staging/Assets" | Out-Null

          Copy-Item dist/limedl-native.exe $staging/
          pwsh scripts/gen-msix-assets.ps1 -OutDir "$staging/Assets"

          # MSIX versions are strictly a.b.c.d (numeric only) — drop any
          # prerelease suffix from the tag.
          $numeric = ($version -split '-')[0]
          $msixVersion = "$numeric.0"

          $manifest = Get-Content packaging/msix/AppxManifest.xml -Raw
          $manifest = $manifest `
            -replace '__VERSION__', $msixVersion `
            -replace '__MSIX_IDENTITY_NAME__', $env:MSIX_IDENTITY_NAME `
            -replace '__MSIX_PUBLISHER__', $env:MSIX_PUBLISHER
          [System.IO.File]::WriteAllText("$staging/AppxManifest.xml", $manifest, (New-Object System.Text.UTF8Encoding($false)))

          # Locate the newest Windows SDK's MakeAppx.
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^10\.\d' } |
            Sort-Object -Property Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\makeappx.exe" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found" }

          & $makeappx pack /d $staging /p "dist\limedl-native-v$version-windows-x86_64.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed with $LASTEXITCODE" }
        env:
          MSIX_IDENTITY_NAME: Zkz20.limedl-native
          MSIX_PUBLISHER: "CN=zkz098"

      # ── Sign everything (minisign, shared with the Tauri edition) ──────
      - name: Sign artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          foreach ($file in @(
            "dist/limedl-native-v$version-windows-x86_64-setup.exe",
            "dist/limedl-native-v$version-windows-x86_64-portable.zip",
            "dist/limedl-native-v$version-windows-x86_64.msix"
          )) {
            npx --yes @tauri-apps/cli signer sign $file
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $file" }
          }

      # ── Self-update manifest ───────────────────────────────────────────
      - name: Generate latest-native.json
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          pwsh scripts/gen-native-manifest.ps1 `
            -Version $version `
            -SetupExe "dist/limedl-native-v$version-windows-x86_64-setup.exe" `
            -PortableZip "dist/limedl-native-v$version-windows-x86_64-portable.zip" `
            -Notes @'
          ${{ needs.changelog.outputs.body }}
          '@ `
            -OutFile dist/latest-native.json

      # ── Upload to release ──────────────────────────────────────────────
      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            dist/limedl-native-v*-windows-x86_64-setup.exe
            dist/limedl-native-v*-windows-x86_64-setup.exe.sig
            dist/limedl-native-v*-windows-x86_64-portable.zip
            dist/limedl-native-v*-windows-x86_64-portable.zip.sig
            dist/limedl-native-v*-windows-x86_64.msix
            dist/limedl-native-v*-windows-x86_64.msix.sig
            dist/latest-native.json
          body: ${{ needs.changelog.outputs.body }}
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # Tauri Desktop — Linux AppImage (with Wayland library pruning)
  # ═══════════════════════════════════════════════════════════════════════
  build-tauri-linux:
    name: Tauri linux-x86_64
    runs-on: ubuntu-latest
    needs: changelog
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # ── Node.js & frontend deps ────────────────────────────────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-release-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-release-${{ runner.os }}-

      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # ── Rust toolchain ─────────────────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-tauri-linux-x86_64

      # ── Linux system deps ──────────────────────────────────────────────
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ── Build Tauri AppImage ───────────────────────────────────────────
      - name: Build Tauri AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles appimage

      # ── Download appimagetool ──────────────────────────────────────────
      - name: Download appimagetool
        run: |
          mkdir -p .tools
          curl --fail --show-error --location --proto '=https' \
            -o .tools/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x .tools/appimagetool

      # ── Prune bundled Wayland libraries ────────────────────────────────
      - name: Prune bundled Wayland libraries from AppImage
        run: |
          APPIMAGE=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage artifact found" >&2
            exit 1
          fi
          node scripts/prune-appimage-wayland-libs.mjs \
            --appimage "$APPIMAGE" \
            --appimagetool "$PWD/.tools/appimagetool" \
            --arch x86_64
          rm -f "${APPIMAGE}.sig"

      # ── Sign pruned AppImage ───────────────────────────────────────────
      - name: Sign pruned AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          APPIMAGE=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage artifact found" >&2
            exit 1
          fi
          pnpm tauri signer sign "$APPIMAGE"

      # ── Upload to release ──────────────────────────────────────────────
      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          body: ${{ needs.changelog.outputs.body }}
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # NAS Server — single binary with embedded frontend
  # ═══════════════════════════════════════════════════════════════════════
  build-nas:
    name: NAS ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: changelog
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: tar.gz
            binary: limedl

          - name: linux-aarch64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            ext: tar.gz
            binary: limedl

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
            binary: limedl.exe

          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
            binary: limedl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # ── Frontend build (NAS mode, identical across platforms) ──────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-release-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-release-${{ runner.os }}-

      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build frontend (NAS mode)
        run: pnpm run build:nas

      # ── Rust toolchain ─────────────────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-nas-${{ matrix.target }}

      # ── musl toolchain (Linux only) ────────────────────────────────────
      - name: Install musl target
        if: contains(matrix.target, 'musl')
        run: |
          rustup target add ${{ matrix.target }}
          sudo apt-get update && sudo apt-get install -y musl-tools

      # ── Build server binary (NAS: x86-64-v2 for broad HW compat) ──────
      - name: Build binary
        env:
          # Desktop targets default to x86-64-v3 in config.toml; NAS overrides to v2
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-cpu=x86-64-v2' || '' }}
        run: cargo build --locked --release --target ${{ matrix.target }} --features embed-frontend --manifest-path crates/limedl-server/Cargo.toml

      # ── Package ────────────────────────────────────────────────────────
      - name: Package (Linux / macOS)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NAME="${{ matrix.name }}"
          BINARY="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          ASSET="limedl-nas-v${VERSION}-${NAME}.tar.gz"
          cp "$BINARY" limedl-nas
          tar -czf "$ASSET" limedl-nas
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.VERSION }}"
          $NAME = "${{ matrix.name }}"
          $BINARY = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          $ASSET = "limedl-nas-v${VERSION}-${NAME}.zip"
          Compress-Archive -Path $BINARY -DestinationPath $ASSET
          echo "ASSET=$ASSET" >> $env:GITHUB_ENV

      # ── Upload to release ──────────────────────────────────────────────
      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: ${{ env.ASSET }}
          body: ${{ needs.changelog.outputs.body }}
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
