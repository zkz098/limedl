name: Release

on:
  push:
    tags: ['v*']

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Tauri Desktop — platform-specific bundles (MSI, DMG, deb, AppImage)
  # ═══════════════════════════════════════════════════════════════════════
  build-tauri:
    name: Tauri ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest

          - name: macos-aarch64
            os: macos-latest

          - name: macos-x86_64
            os: macos-13

          - name: linux-x86_64
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # ── Node.js & frontend deps ────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-release-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-release-${{ runner.os }}-

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # ── Rust toolchain ─────────────────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2
        with:
          key: release-tauri-${{ matrix.name }}

      # ── Linux system deps (Tauri requires WebKit) ──────────────────────
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ── Build Tauri ────────────────────────────────────────────────────
      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'v${{ steps.version.outputs.VERSION }}'
          releaseBody: ''
          releaseDraft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
          updaterJsonPreferNsis: true

  # ═══════════════════════════════════════════════════════════════════════
  # NAS Server — single binary with embedded frontend
  # ═══════════════════════════════════════════════════════════════════════
  build-nas:
    name: NAS ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: tar.gz
            binary: limedl

          - name: linux-aarch64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            ext: tar.gz
            binary: limedl

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
            binary: limedl.exe

          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
            binary: limedl

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # ── Frontend build (NAS mode, identical across platforms) ──────────
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-release-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-release-${{ runner.os }}-

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Build frontend (NAS mode)
        run: pnpm run build:nas

      # ── Rust toolchain ─────────────────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2
        with:
          key: release-nas-${{ matrix.target }}

      # ── musl toolchain (Linux only) ────────────────────────────────────
      - name: Install musl target
        if: contains(matrix.target, 'musl')
        run: |
          rustup target add ${{ matrix.target }}
          sudo apt-get update && sudo apt-get install -y musl-tools

      # ── Build server binary (NAS: x86-64-v2 for broad HW compat) ──────
      - name: Build binary
        env:
          # Desktop targets default to x86-64-v3 in config.toml; NAS overrides to v2
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-cpu=x86-64-v2' || '' }}
        run: cargo build --release --target ${{ matrix.target }} --features embed-frontend --manifest-path crates/limedl-server/Cargo.toml

      # ── Package ────────────────────────────────────────────────────────
      - name: Package (Linux / macOS)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NAME="${{ matrix.name }}"
          BINARY="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          ASSET="limedl-nas-v${VERSION}-${NAME}.tar.gz"
          cp "$BINARY" limedl-nas
          tar -czf "$ASSET" limedl-nas
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.VERSION }}"
          $NAME = "${{ matrix.name }}"
          $BINARY = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          $ASSET = "limedl-nas-v${VERSION}-${NAME}.zip"
          Compress-Archive -Path $BINARY -DestinationPath $ASSET
          echo "ASSET=$ASSET" >> $env:GITHUB_ENV

      # ── Upload to release ──────────────────────────────────────────────
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
