[package]
name = "limedl-server"
version.workspace = true
description = "Headless limedl daemon exposing the Aria2 JSON-RPC API (NAS / server builds)"
license.workspace = true
edition = "2024"
# Workspace-internal: limedl ships binaries and a container image, never
# crates.io packages. Keeping this explicit is what makes `pub(crate)` -> `pub`
# promotions across the crate split a non-event for semver.
publish = false

[lib]
name = "limedl_server"
path = "src/lib.rs"

[[bin]]
name = "limedl-server"
path = "src/main.rs"

[dependencies]
# The daemon serves both protocols: the engine, and the Aria2 JSON-RPC facade
# that `limedl-rpc` hosts.
limedl-core = { path = "../limedl-core" }
limedl-rpc = { path = "../limedl-rpc" }
# `signal` is what turns SIGTERM/SIGINT into a clean engine shutdown; `fs` is
# used for the data-directory lock, `sync` for the RPC shutdown watch channel.
tokio = { workspace = true, features = ["signal", "macros", "rt-multi-thread"] }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
# Hands a real JSON-RPC request to the daemon over TCP; already in the
# workspace graph as a core dependency.
reqwest = { workspace = true }
ntest = { workspace = true }
