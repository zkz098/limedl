[workspace]
resolver = "3"
members = ["crates/limedl-core", "crates/limedl-server", "src-tauri"]

[workspace.package]
version = "0.1.14"
license = "GPL-3.0-or-later"

[profile.release]
# Optimized for binary size while preserving good runtime performance.
# Download manager is I/O-bound, not CPU-bound — size matters for distribution.
codegen-units = 4
lto = "thin" # Thin LTO: ~90% of fat LTO benefit at ~20% of link time
opt-level = "s" # Optimize for size — I/O-bound app, distribution size matters
panic = "abort" # Strip unwinding machinery → smaller binary
strip = true # Strip debug symbols

# ── CI-optimized dev profile ────────────────────────────────────
[profile.dev]
debug = "line-tables-only" # Keep backtraces, skip full debug info

[profile.dev.package."*"]
opt-level = 1 # Light optimization for dependencies (faster test binaries)
debug = false # Skip debug info for dependencies

[profile.test]
inherits = "dev" # Use dev profile settings
