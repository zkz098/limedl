# limedl build configuration
# See AGENTS.md for the MSVC environment setup required before building on Windows.
#
# Target CPU strategy:
#   Desktop (Slint client) → x86-64-v3 (Haswell 2013+)
#   NAS server targets (musl)    → x86-64-v2 (Nehalem 2008+, broad NAS HW compat)

[target.x86_64-pc-windows-msvc]
# Desktop: x86-64-v3 for modern performance
# Use rust-lld linker (faster than MSVC link.exe)
rustflags = [
  "-C",
  "target-cpu=x86-64-v3",
  "-C",
  "linker=rust-lld",
]

[target.x86_64-unknown-linux-gnu]
# Desktop / CI tests: x86-64-v3
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-unknown-linux-musl]
# NAS server: x86-64-v2 for broad NAS hardware compatibility
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.aarch64-unknown-linux-musl]
# NAS server (ARM): no x86 CPU flag needed

[target.aarch64-apple-darwin]
# Desktop macOS ARM: apple-m1 baseline
#
# No `-A linker_messages` any more. It existed to keep Apple's ld note
#   ld: __eh_frame section too large (max 16MB) to encode dwarf unwind offsets in
#       compact unwind table, performance of exception handling might be affected
# out of cargo's fatal `build.warnings = deny`: rustc reports linker stderr through
# the `linker_messages` lint, which `-D warnings` exempts but `build.warnings = deny`
# does not. That note came from the Skia-linked test binaries this repository no
# longer builds (see the renderer note in crates/limedl-native/Cargo.toml), and
# `check-macos` runs with the fatal-warnings gate, so a reappearance fails that job
# instead of going unnoticed.
rustflags = ["-C", "target-cpu=apple-m1"]

[alias]
# `cargo xtask <command>` — repository tooling (update-channel signing).
# See xtask/src/main.rs.
xtask = "run --quiet --package xtask --"

[target.x86_64-apple-darwin]
# Desktop macOS x86_64: x86-64-v3
# Kept in sync with aarch64-apple-darwin above: no macOS leg builds this target
# today, and identical flag lists avoid rediscovering the difference on the first
# x86_64 release.
rustflags = ["-C", "target-cpu=x86-64-v3"]
