name: Nightly Benchmarks

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: read

jobs:
  e2e-bench:
    name: E2E Download Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Restore main baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: criterion-baseline
          key: criterion-${{ runner.os }}-main-e2e

      - name: Link baseline
        run: |
          if [ -d "criterion-baseline" ] && [ "$(ls -A criterion-baseline 2>/dev/null)" ]; then
            mkdir -p target/criterion
            cp -r criterion-baseline/* target/criterion/
          fi

      - name: Run E2E benchmarks
        run: cargo bench --manifest-path crates/limedl-core/Cargo.toml --features test-utils --bench download_e2e

      - name: Copy results to baseline
        run: |
          rm -rf criterion-baseline
          mkdir -p criterion-baseline
          if [ -d "target/criterion/download_e2e" ]; then
            cp -r target/criterion/download_e2e criterion-baseline/
          fi
          if [ -d "target/criterion/report" ]; then
            cp -r target/criterion/report criterion-baseline/
          fi

      - name: Cache baseline
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: criterion-baseline
          key: criterion-${{ runner.os }}-main-e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nightly-bench-report
          path: criterion-baseline/report/
