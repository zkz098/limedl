# SonarQube Cloud configuration for limedl.
#
# The analysis is CI-based, deliberately not Automatic Analysis: SonarQube Cloud
# excludes Rust from Automatic Analysis ("available for all supported languages
# except for Objective-C, Dart, and Rust"), and Rust is this repository's main
# language (~70k lines across crates/ and xtask). Automatic Analysis therefore
# has to stay disabled for the project — otherwise the scanner runs are rejected
# and the build legs fail.
#
# The scan itself runs in the `check-rust` job of .github/workflows/ci.yml: that
# job already installs the toolchain, clippy, the GTK dev packages, the MiSans
# font artifact and a warm rust-cache — everything the Rust analyzer needs to run
# `cargo clippy` itself. A dedicated workflow would have cost another ~0.8 GB
# rust-cache entry against GitHub's 10 GB per-repo ceiling (see the caching
# contract at the top of ci.yml).

sonar.projectKey=zkz098_limedl
sonar.organization=zkz098
sonar.projectName=limedl
sonar.sourceEncoding=UTF-8

# The scope is the whole project: SonarQube Cloud's analysis scope UX ignores
# sonar.sources now (the scanner warns "configured but have no effect"), so only
# the exclusions below restrict what is indexed. They are load-bearing rather
# than cosmetic — SonarQube does not read .gitignore, and target/ holds .rs files
# emitted by build scripts that would otherwise be analyzed as product code.
sonar.exclusions=**/target/**,**/node_modules/**,**/.astro/**,**/dist/**,**/.local/**,**/*.lock,**/pnpm-lock.yaml,**/package-lock.json

# Rust analysis drives `cargo clippy` against the manifest found in the project
# root; the root manifest of this workspace lists every member, so the default is
# enough. Uncomment if a future layout stops being picked up (comma-separated):
# sonar.rust.cargo.manifestPaths=crates/limedl-core/Cargo.toml,crates/limedl-native/Cargo.toml,xtask/Cargo.toml

# Coverage: check-rust writes one report inside each crate it describes
# (crates/limedl-core/lcov-core.info, crates/limedl-native/lcov-native.info)
# before it runs the scan — see the ordering contract in ci.yml — and the
# scanner imports them through the module-relative paths below. The paths are
# relative to the *module*, not to the repository: the Rust analyzer turns the
# workspace into one module per Cargo manifest (limedl-core, limedl-native,
# xtask) and each one looks for the report under its own base dir, so a copy at
# the repository root is never found.
#
# xtask has no report and is excluded from the metric instead of being silently
# counted as 0% — SonarQube treats every coverable line missing from a report as
# uncovered. limedl-server is excluded the same way: its suite runs in check-rust
# but no llvm-cov report is produced for it, so it would contribute only 0%-covered
# lines (the daemon's value is in its end-to-end test, not in instrumented
# per-line coverage). scripts/ and website/ are excluded for the same reason:
# llvm-cov cannot instrument PowerShell or the Astro site, so they only ever
# contributed 0%-covered lines to the denominator (591 lines ≈ 3 pp of the
# project number before this exclusion).
#
# Limedl-core measures 86.90% of 15376 llvm-cov lines under the pinned
# cargo-llvm-cov 0.9.0 (Linux CI run 37088319623, 2026-10-03). Since 0.6.22 the
# tool's default ignore regex drops test files (`tests/`, `tests.rs`,
# `*_tests.rs`), so this is product code only. The 87.37% of 14561 lines quoted
# before that was a 0.6.21 report: 0.6.x instrumented the whole dependency graph
# via RUSTFLAGS, while 0.7.0+ instruments only the crates that need it through a
# rustc wrapper, and the two produce different line sets for the same tree (a
# fresh 0.6.21 build: 14561; a fresh 0.9.0 build: 15376). "Sonar way" wants
# 80% on new code. The hard gate is `--fail-under-lines 85` in ci.yml, not this
# quality gate: moving the condition needs a custom gate, a Team/Enterprise
# feature ("only available in the Team and Enterprise plans") — the organization
# has a gate named limedl prepared with new_coverage < 70, but the Free plan
# refuses to associate it with this project.
#
# Coverage is line coverage in practice: cargo-llvm-cov's `--branch` is unstable
# and its stable toolchain rejects it, so the LCOV carries no BRDA records and
# Sonar reports no condition coverage. If branch coverage is ever wanted, the
# two llvm-cov steps in ci.yml need a pinned nightly first.
#
# The reports carry absolute CI paths (SF:/home/runner/work/limedl/...), which
# the scanner resolves against the files it analyzed on the same machine; if a
# run ever reports 0% coverage, that resolution is the first thing to check.
sonar.rust.lcov.reportPaths=lcov-core.info,lcov-native.info
sonar.coverage.exclusions=xtask/**,crates/limedl-server/**,scripts/**,website/**
