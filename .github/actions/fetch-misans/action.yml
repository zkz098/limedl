name: Fetch MiSans VF
description: >
  Provides crates/limedl-native/assets/fonts/MiSansVF.ttf, which the Slint UI
  embeds at compile time. The font is not in git (the MiSans license forbids
  redistributing the file itself, only works embedding it), so it comes from
  Xiaomi's CDN via `cargo xtask fetch-font`.

  `mode: fetch` restores the pinned font from the Actions cache and downloads it
  on a miss; `mode: verify` only checks a file that another job supplied (as an
  artifact). The transport ladder, chunked range fetch and escape hatches live
  in xtask/src/fetch_font.rs — see its header for why.

  Callers must set up the Rust toolchain first: the `font` jobs in ci.yml and
  release.yml do that explicitly, every other caller already builds the
  workspace.

inputs:
  mode:
    description: '"fetch" (cache + download) or "verify" (check only).'
    required: false
    default: fetch

runs:
  using: composite
  steps:
    # Key carries the pinned font hash (0ddef906): a new font build needs a new
    # key, and a stale entry can never satisfy the hash check in the script.
    - name: Cache bundled MiSans VF font
      if: inputs.mode == 'fetch'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: crates/limedl-native/assets/fonts/MiSansVF.ttf
        key: misans-vf-${{ runner.os }}-0ddef906

    # Also the cache-hit path: the script hash-checks whatever is on disk and
    # downloads again when it does not match, so a corrupt entry self-heals
    # instead of failing later inside build.rs.
    - name: Fetch bundled MiSans VF font
      if: inputs.mode == 'fetch'
      shell: pwsh
      run: cargo xtask fetch-font

    - name: Verify bundled MiSans VF font
      if: inputs.mode == 'verify'
      shell: pwsh
      run: cargo xtask fetch-font --verify
