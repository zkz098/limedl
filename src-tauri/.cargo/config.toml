# CPU baseline: x86-64-v3 (Haswell, Intel 2013 / Excavator, AMD 2015).
# This app targets modern desktop devices — older hardware is not supported.
# Targets x86_64 (Windows/Linux) only; aarch64-apple-darwin is unaffected.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "link-arg=-fuse-ld=mold"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v3"]

# ── Optional: faster linker for macOS local builds ─────────────
