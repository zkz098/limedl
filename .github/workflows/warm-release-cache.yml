name: Warm release cache

# Keeps the *desktop* release builds incremental.
#
# release.yml's `build-native` / `build-native-macos` jobs restore the
# `release-native-windows-x86_64` / `release-native-darwin-aarch64` rust-cache
# entries. Before this workflow existed those entries could only be written by a
# release itself, and with the repo's cache usage at GitHub's 10 GB ceiling they
# were evicted long before the next tag (an entry not accessed for 7 days is
# deleted outright) — so every release paid a cold Slint rebuild (measured:
# 997 s of `cargo build --release -p limedl-native` on Windows, 16.6 of the job's
# 18.6 minutes; 1481 s on macOS, whose 1588 s job was the release's critical path).
#
# These jobs are now the *only* writers of those keys: the release legs restore
# only (`save-if: github.ref_type == 'branch'` is false on a tag), because an
# entry written there would be scoped to `refs/heads/refs/tags/v<N>` and no later
# tag could read it back — 2.3 GB per release against the same 10 GB ceiling.
#
# The cache key must stay byte-identical to release.yml's: same `key`, same
# `add-job-id-key: false`, and the same pre-cache steps. rust-cache hashes the
# rust toolchain plus every RUST*/CARGO*/CC*/CFLAGS*/CXX*/CMAKE* env var, so
# exporting one of those before the cache step (or after it, in release.yml)
# silently splits the two caches.
#
# rust-cache only *writes* a cache entry when the restore was not a full match,
# which is exactly what a release needs: the tag commit usually bumps versions
# (new lock hash → prefix fallback onto this entry, then a fresh save).

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "installer/**"
      - ".github/workflows/warm-release-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-release-cache
  cancel-in-progress: true

jobs:
  warm-native:
    name: Warm cache (windows-x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Keep Defender's real-time scanner out of target/ (see ci.yml). Adds no
      # env vars, so the rust-cache key stays byte-identical to release.yml's.
      - name: Exclude build paths from Defender real-time scanning
        shell: pwsh
        run: |
          foreach ($path in @($env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", $env:RUNNER_TEMP)) {
            Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
          }
          if ($status = Get-MpComputerStatus -ErrorAction SilentlyContinue) {
            Write-Host "Defender real-time protection enabled: $($status.RealTimeProtectionEnabled)"
          }

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-native-windows-x86_64
          add-job-id-key: false

      # limedl-native embeds MiSans VF at compile time and the font is not in
      # git (MiSans font license) — the shared composite action restores it from
      # the pinned-hash cache or downloads it. It adds no env vars, so the
      # rust-cache key above stays byte-identical to release.yml's.
      - uses: ./.github/actions/fetch-misans

      # Same command release.yml runs. Signing/packaging is skipped on purpose:
      # only the compiled artifacts are worth caching.
      - name: Build desktop release binary
        shell: pwsh
        run: cargo build --locked --release -p limedl-native

  # The macOS leg had no main-side writer at all, so *every* release paid a cold
  # 1481 s build — the entry the release saved itself was tag-scoped and the next
  # tag could not read it. Same contract as the Windows job above: identical
  # key/inputs and no env vars exported before the cache step (rust-cache hashes
  # them, and a different hash silently splits the two caches).
  warm-native-macos:
    name: Warm cache (darwin-aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-native-darwin-aarch64
          add-job-id-key: false

      # limedl-native embeds MiSans VF at compile time and the font is not in
      # git (MiSans font license) — the shared composite action restores it from
      # the pinned-hash cache or downloads it. It adds no env vars, so the
      # rust-cache key above stays byte-identical to release.yml's.
      - uses: ./.github/actions/fetch-misans

      - name: Build desktop release binary
        shell: bash
        run: cargo build --locked --release -p limedl-native
