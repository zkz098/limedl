[package]
name = "limedl-native"
version.workspace = true
description = "Lightweight native desktop UI for limedl based on Slint"
license.workspace = true
edition = "2024"
build = "build.rs"

[[bin]]
name = "limedl-native"
path = "src/main.rs"

[dependencies]
limedl-core = { path = "../limedl-core", features = ["aria2-rpc"] }
slint = { workspace = true, features = [
  "std",
  "backend-default",
  "renderer-skia",
  "accessibility",
  "compat-1-2",
  "raw-window-handle-06",
] }
raw-window-handle = "0.6"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
tray-icon = "0.24"
muda = "0.19"
notify-rust = "4"
# rfd's build script panics when both of its Linux backends (`gtk3` and
# `xdg-portal`) are enabled for the same target. The default pin is `gtk3`,
# which is what the desktop app shipped with while the retired `src-tauri`
# crate pulled `tauri-plugin-dialog` → `rfd/gtk3` into every workspace build
# (`cargo clippy --workspace`, `cargo llvm-cov`). That constraint is gone, so
# switching to the `xdg-portal` backend is now a free choice — it only needs a
# portal service at runtime; the `gtk3` backend needs `libgtk-3-dev` at build
# time (already installed in CI).
# Both flags only affect Linux (their gtk/ashpd dependencies are declared under
# that target's cfg), so this is a no-op on Windows and macOS.
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png"] }
sys-locale = "0.3"
reqwest = { workspace = true }
minisign-verify = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
self-replace = "1.5"
percent-encoding = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
zip = { version = "8", default-features = false, features = ["deflate"] }
windows = { version = "0.61", features = [
  "Foundation",
  "ApplicationModel",
  "Services_Store",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# windows 0.61 disables windows-future's `std` feature, which is where the
# Future/IntoFuture impls for IAsyncOperation live — re-enable it so the Store
# updater can await async WinRT calls instead of blocking the UI thread.
windows-future = { version = "0.2", default-features = false, features = ["std"] }

[target.'cfg(not(windows))'.dependencies]
flate2 = "1"
tar = "0.4"

[build-dependencies]
slint-build = { workspace = true }
winres = "0.1"

[dev-dependencies]
tempfile = { workspace = true }
skia-safe = { version = "0.99", features = ["textlayout"] }

[features]
# Debug-only Skia hinting/font-rendering repro (tests/skia_hint_repro.rs). It
# writes comparison PNGs to the temp dir, asserts nothing useful in CI and pulls
# an extra skia-safe build, so it is opt-in:
#   cargo test -p limedl-native --features skia-hint-repro
skia-hint-repro = []

[[test]]
name = "skia_hint_repro"
path = "tests/skia_hint_repro.rs"
required-features = ["skia-hint-repro"]
