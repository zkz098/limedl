[package]
name = "limedl"
version.workspace = true
description = "Tauri v2 desktop download manager — HTTP, BitTorrent"
authors = ["limedl contributors"]
license.workspace = true
edition = "2024"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The _lib suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "limedl_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
limedl-core = { path = "../crates/limedl-core", features = ["aria2-rpc"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "http2"] }
futures-util = "0.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-os = "2"
mimalloc = "0.1.48"
irontide = { version = "1", default-features = false, features = ["crypto-ring"] }
anyhow = "1"
tracing = "0.1"
async-trait = "0.1"
dashmap = "6"
foldhash = "0.2"
parking_lot = "0.12"
rand = { version = "0.8", optional = true }

[features]
test-utils = ["limedl-core/test-utils", "limedl-core/aria2-rpc", "rand"]

[dev-dependencies]
tempfile = "3"
ntest = "0.9"
rand = "0.8"
bytes = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "aimd"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "rate_limiter"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "download_e2e"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "buffer_pool"
harness = false
required-features = ["test-utils"]
