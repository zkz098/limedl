[workspace]
resolver = "3"
members = ["crates/limedl-core", "crates/limedl-native", "crates/limedl-server", "src-tauri"]

[workspace.package]
version = "0.2.1"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7" }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "http2"] }
futures-util = "0.3"
blake3 = "1"
sha2 = "0.11"
sha1 = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sanitize-filename = "0.6"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
percent-encoding = "2"
regex = "1"
anyhow = "1"
time = { version = ">=0.3.47, <0.4", features = ["local-offset"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors"] }
base64 = "0.23"
rusqlite = { version = "0.40", features = ["bundled", "cache"] }
async-trait = "0.1"
dashmap = "6"
bytes = "1"
foldhash = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs4 = { version = "1", features = ["sync"] }
rand = "0.10"
irontide = { version = "1", default-features = false, features = ["crypto-aws-lc"] }
libc = "0.2"
open = "5"
ts-rs = { version = "12" }
mimalloc = "0.1.48"
minisign-verify = "0.2"
governor = "0.10"
subtle = "2"
clap = { version = "4", features = ["derive"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
rust-embed = "8"
tempfile = "3"
ntest = "0.9"
serde_bytes = "0.11"
tokio-tungstenite = "0.30"
criterion = { version = "0.8", features = ["html_reports"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2" }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-os = "2"
slint = { version = "1.9", default-features = false }
slint-build = "1.9"

[profile.release]
# Optimized for binary size while preserving good runtime performance.
# Download manager is I/O-bound, not CPU-bound — size matters for distribution.
codegen-units = 4
lto = "thin" # Thin LTO: ~90% of fat LTO benefit at ~20% of link time
opt-level = "s" # Optimize for size — I/O-bound app, distribution size matters
panic = "abort" # Strip unwinding machinery → smaller binary
strip = true # Strip debug symbols

# ── Native UI 独立优化 ─────────────────────────────────────────
# Slint/Skia 渲染为 CPU/GPU 密集型，需速度优先；覆盖 workspace 的体积优先。
# 仅 limedl-native crate 用 opt-level 3，其余 crate 仍保持 "s" 以控制分发体积。
[profile.release.package.limedl-native]
opt-level = 3

# 可选：如需全链路速度优先（连带 limedl-core / slint），改用自定义 profile：
#   cargo build -p limedl-native --profile native-release
[profile.native-release]
inherits = "release"
opt-level = 3
codegen-units = 1 # 更激进的单单元优化，利于 Skia 内联
lto = "thin"

# ── CI-optimized dev profile ────────────────────────────────────
[profile.dev]
debug = "line-tables-only" # Keep backtraces, skip full debug info

[profile.dev.package."*"]
opt-level = 1 # Light optimization for dependencies (faster test binaries)
debug = false # Skip debug info for dependencies

[profile.test]
inherits = "dev" # Use dev profile settings
