[package]
name = "limedl-server"
version.workspace = true
description = "Headless download daemon and CLI for limedl — axum HTTP/WebSocket JSON-RPC server"
license.workspace = true
edition = "2024"

[[bin]]
name = "limedl"
path = "src/main.rs"

[lib]
name = "limedl_server"
path = "src/lib.rs"

[dependencies]
limedl-core = { path = "../limedl-core" }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "limit"] }
governor = "0.7"
nonzero_ext = "0.3"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std"] }
parking_lot = "0.12"
futures-util = "0.3"
base64 = "0.22"
rand = "0.8"
irontide = { version = "1", default-features = false, features = ["crypto-ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
limedl-core = { path = "../limedl-core", features = ["test-utils"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
serde_json = "1"
ntest = "0.9"
