[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[advisories]
yanked = "warn"
unmaintained = "workspace"
# quick-xml 0.39.4 (pinned by wayland-scanner 0.31.10, the latest published
# release) carries two high-severity DoS advisories. limedl's exposure is
# build-only: quick-xml is a proc-macro/build-time dependency of
# wayland-scanner that parses host-preinstalled Wayland protocol XML at
# compile time; limedl's runtime never calls `BytesStart::attributes()` or
# `NsReader` on untrusted input (grep confirms no `quick_xml` imports in
# limedl source). The advisories describe CPU-exhaustion / OOM vectors
# triggered by attacker-controlled XML, which cannot reach a build-time
# Wayland protocol parser. wayland-scanner's `^0.39` constraint forbids a
# `cargo update` to 0.41 — only an upstream release can fix the path.
# Revisit when wayland-rs publishes a version that bumps its quick-xml dep
# (likely 0.31.11 or 0.32.0).
ignore = ["RUSTSEC-2026-0194", "RUSTSEC-2026-0195"]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  # webpki-roots (transitive via reqwest/hyper-rustls) — Mozilla root CA
  # bundle shipped under CDLA-Permissive-2.0 (Community Data License
  # Agreement Permissive 2.0). It's a permissive data/license grant, not
  # copyleft, and is OSI-recognized. Required for TLS validation in
  # HTTP/HTTPS download paths.
  "CDLA-Permissive-2.0",
  # limedl itself is GPL-3.0-or-later (Cargo.toml workspace license +
  # LICENSE file). irontide / irontide-bencode / irontide-core are
  # GPL-3.0-or-later, integrated as the core BT engine, and their virality
  # is acknowledged — limedl as a whole is conveyed under GPL-3.0-or-later.
  "GPL-3.0-or-later",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
