[workspace]
resolver = "3"
members = ["crates/limedl-core", "crates/limedl-native", "xtask"]

[workspace.package]
version = "0.4.2"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7" }
# Default features are kept ON deliberately: reqwest's `default` set includes
# `system-proxy` (`hyper-util/client-proxy-system`), without which
# `ProxyMode::System` silently ignores the Windows registry / macOS system
# configuration, plus `charset`. Only the extras we need are listed here.
# Guarded by `workspace_enables_reqwest_system_proxy` in
# crates/limedl-core/src/http_client_factory/tests.rs.
reqwest = { version = "=0.13.4", features = [
  "stream",
  # HTTP/3 over QUIC: pulls in `h3` / `h3-quinn` / `quinn` and turns on `rustls`.
  # Upstream marks this *unstable*: it additionally requires `--cfg
  # reqwest_unstable`, which `.cargo/config.toml` adds to every supported
  # target's rustflags (a missing cfg is a hard `compile_error!` in reqwest).
  "http3",
] }
futures-util = "0.3"
blake3 = "1"
sha2 = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sanitize-filename = "0.6"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
percent-encoding = "2"
regex = "1"
anyhow = "1"
time = { version = ">=0.3.37, <0.4", features = ["local-offset"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors"] }
base64 = "0.23"
rusqlite = { version = "0.40", features = ["bundled", "cache"] }
async-trait = "0.1"
dashmap = "6"
bytes = "1"
foldhash = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs4 = { version = "1", features = ["sync"] }
rand = "0.10"
# Pinned exactly: upstream's git repository was removed in 2026, so the engine is
# frozen on crates.io and 1.8/2.0 must not arrive through `cargo update`. See
# "BitTorrent engine status" in README.md before touching this line.
irontide = { version = "=1.7.0", default-features = false, features = ["crypto-aws-lc"] }
libc = "0.2"
open = "5"
minisign-verify = "0.2"
mimalloc = "0.1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
ntest = "0.9"
serde_bytes = "0.11"
tokio-tungstenite = "0.30"
criterion = { version = "0.8", features = ["html_reports"] }
slint = { version = "1.9", default-features = false }
slint-build = "1.9"
# In-process Slint UI testing backend (see `crates/limedl-native/src/ui_tests/`).
# Pinned EXACTLY and not semver-following: the crate hard-depends on
# `i-slint-core = "=x.y.z"` and breaks the build if that does not match the
# `slint` version resolved above. Bump all three together.
# A mismatch is not a compile error but a split Slint platform — the testing
# backend installs itself for one `i-slint-core` while the generated components
# belong to the other, and `MainWindow::new()` fails with "platform not
# initialized" (or opens a real window).
i-slint-backend-testing = "=1.17.1"

[profile.release]
# Optimized for binary size while preserving good runtime performance.
# Download manager is I/O-bound, not CPU-bound — size matters for distribution.
codegen-units = 4
lto = "thin" # Thin LTO: ~90% of fat LTO benefit at ~20% of link time
opt-level = "s" # Optimize for size — I/O-bound app, distribution size matters
panic = "abort" # Strip unwinding machinery → smaller binary
strip = true # Strip debug symbols

# ── Native UI 独立优化 ─────────────────────────────────────────
# Slint/FemtoVG 渲染为 CPU/GPU 密集型，需速度优先；覆盖 workspace 的体积优先。
# 仅 limedl-native crate 用 opt-level 3，其余 crate 仍保持 "s" 以控制分发体积。
[profile.release.package.limedl-native]
opt-level = 3

# 可选：如需全链路速度优先（连带 limedl-core / slint），改用自定义 profile：
#   cargo build -p limedl-native --profile native-release
[profile.native-release]
inherits = "release"
opt-level = 3
codegen-units = 1 # 更激进的单单元优化，利于渲染热路径内联
lto = "thin"

# ── CI-optimized dev profile ────────────────────────────────────
[profile.dev]
debug = "line-tables-only" # Keep backtraces, skip full debug info

[profile.dev.package."*"]
opt-level = 1 # Light optimization for dependencies (faster test binaries)
debug = false # Skip debug info for dependencies

[profile.test]
inherits = "dev" # Use dev profile settings
# CI runs the whole suite on every push (Windows lint/test jobs, macOS, Linux
# coverage): the workspace crates' own line tables are pure link-time and disk
# overhead there. Dependencies already skip debug info via
# `[profile.dev.package."*"]`, which this profile inherits (verified with
# `cargo test --no-run -v`: dependencies are compiled with
# `-C strip=debuginfo`). Release artifacts use a separate profile and are
# unaffected. Local debugging: `cargo test --profile dev` (line tables kept).
debug = false
