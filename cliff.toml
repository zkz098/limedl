# git-cliff configuration — generates release changelogs from Conventional Commits.
# Docs: https://git-cliff.org/docs/configuration
#
# Consumed by:
#   - CI: .github/workflows/release.yml (generates the GitHub release body on tag push)
#   - CLI: `git-cliff` (local preview, e.g. `git-cliff --unreleased -o CHANGELOG.md`)
#
# Releases are tagged "v<semver>" (see scripts/bump-version.mjs); git-cliff scans
# tags to derive the previous release range, so a changelog covers everything since
# the last tag.

[changelog]
# No header/footer decorations — this feeds the GitHub release body directly.
header = ""
footer = ""
# Trim leading/trailing whitespace and blank lines around the body.
trim = true

# Rendered for each release. `{{ version }}`, `{{ timestamp }}`, `{{ group }}` and
# `{{ commit.* }}` are provided by git-cliff.
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
{% if commit.scope %}- **{{ commit.scope }}:** {{ commit.message | upper_first }}{% else %}- {{ commit.message | upper_first }}{% endif %}
{% endfor %}
{% endfor %}
"""

[git]
# Parse commits per the Conventional Commits spec (feat:, fix:, …).
conventional_commits = true
# Drop commits that don't carry a conventional "type" prefix (merges, WIP, etc.).
filter_unconventional = true

commit_parsers = [
  # order matters: a commit is assigned to its first matching parser
  { message = "^feat", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^docs", group = "📚 Documentation" },
  # housekeeping that should NOT appear in release notes
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore|^build|^style", skip = true },
  { message = ".*", group = "Other" },
]
