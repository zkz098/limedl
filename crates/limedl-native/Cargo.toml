[package]
name = "limedl-native"
version.workspace = true
description = "Lightweight native desktop UI for limedl based on Slint"
license.workspace = true
edition = "2024"
build = "build.rs"

[[bin]]
name = "limedl-native"
path = "src/main.rs"

[dependencies]
limedl-core = { path = "../limedl-core", features = ["aria2-rpc"] }
# Slint's renderer is a compile-time choice, and this crate pins the shipped pair
# here instead of exposing it as crate features: FemtoVG/OpenGL as the primary,
# plus Slint's software rasterizer, which `try_create_window_with_fallback_renderer`
# reaches only when GL init fails (RDP sessions, VMs, broken drivers). The
# comparison variants that used to be selectable — Skia on softbuffer/OpenGL and
# FemtoVG/wgpu — are gone: Skia pulled its entire C++ library into every test
# build, and Cargo cannot make a dev-dependency optional to keep that out of the
# test graph.
slint = { workspace = true, features = [
  "std",
  "backend-default",
  "accessibility",
  "compat-1-2",
  "raw-window-handle-06",
  "renderer-femtovg",
  "renderer-software",
] }
raw-window-handle = "0.6"
# `signal` is Unix-only in practice (the `cfg(unix)` SIGTERM/SIGINT watcher in
# `main.rs`); on Windows the feature is inert, and feature unification already
# enables it for limedl-core's tokio in the same build.
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
mimalloc = { workspace = true }
foldhash = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
# Linux uses tray-icon's `ksni` backend: a pure-Rust StatusNotifierItem served
# over the session D-Bus (ksni + zbus), not the GTK3 `libappindicator` one. It
# is what makes the Linux build GTK-free — `gtk`, `gtk-sys`, `libappindicator`
# and `glib 0.18` (RUSTSEC-2024-0429, previously accepted) all leave the graph,
# so neither `libgtk-3-dev`/`libappindicator3-dev` at build time nor
# `libgtk-3-0`/`libayatana-appindicator3-1` at runtime are needed.
# `default-features = false` also drops the `libxdo` half, which `muda` only
# uses so its predefined `Copy`/`Cut`/`Paste`/`SelectAll` items can synthesize
# keystrokes through `xdotool`; limedl builds its own items plus `separator()`
# only, so that feature would cost a `libxdo-dev` build dependency for code
# that is never reached. 0.26 moved `libappindicator` into the default set, so
# it has to be switched off explicitly.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
# `muda` is a direct dependency (the tray menu items are built from it) AND a
# transitive one through `tray-icon`. Features are unified across the whole
# graph, so both crates have to agree on the backend: `tray-icon/ksni` turns on
# `muda/snapshot`, which is how the ksni backend reads the menu as data
# (`ContextMenu::snapshot_handle()`), and `default-features = false` keeps
# muda's own `gtk3` backend out (on Linux without gtk3/gtk4 muda compiles its
# `noop` platform, which is exactly the snapshot-only path). The menu code in
# `tray.rs` is unchanged: the snapshot's activate closures still emit
# `muda::MenuEvent`. Slint's winit backend pulls its own `muda 0.19` for its
# menu handling; that is a separate semver line in Cargo.lock and unrelated to
# the tray (the tray types come from this 0.21 entry).
muda = { version = "0.21", default-features = false, features = ["snapshot"] }
notify-rust = "4"
# rfd's build script panics when both of its Linux backends (`gtk3` and
# `xdg-portal`) are enabled for the same target, so exactly one has to be picked.
#
# `gtk3` was the historical pin: the retired `src-tauri` crate pulled
# `tauri-plugin-dialog` → `rfd/gtk3` into every workspace build (`cargo clippy
# --workspace`, `cargo llvm-cov`), and Cargo unifies features per package, so this
# crate had to follow or both flags would be on at once. That constraint is gone.
#
# `xdg-portal` is now selected because it removes the *build-time* GTK dependency:
# `gtk3` needs `libgtk-3-dev` + `pkg-config` present to compile (`gtk-sys`), which
# every Linux contributor and CI leg had to install, while `xdg-portal` talks to
# the already-running `xdg-desktop-portal` over D-Bus (ashpd/zbus, pure Rust). It
# also gives the native file chooser on Wayland and inside Flatpak/Snap sandboxes,
# where GTK dialogs either mismatch the desktop or fail outright.
#
# `tokio` is REQUIRED alongside `xdg-portal`, not optional: rfd's `build.rs`
# panics with "One of the `tokio` or `async-std` features must be enabled to use
# `xdg-portal`" when neither is set. `default-features = false` drops both, so
# selecting the backend explicitly means selecting a runtime too. `tokio` is the
# right one here — the app is already `#[tokio::main]` and bootstraps limedl-core
# on that runtime, so `async-std` would link a second reactor.
# (The `.await`-based path is not what runs the dialog: `xdg_desktop_portal.rs`
# drives ashpd through `pollster::block_on`. The feature only picks ashpd's
# executor.)
#
# Trade-off: a bare X11 session with no portal service running falls back to the
# portal's own error — `libgtk-3-dev`-free builds cannot show a GTK dialog. Every
# mainstream desktop (GNOME/KDE/XFCE with xdg-desktop-portal*-gtk installed, which
# ships by default) provides one.
#
# This only affects Linux (gtk/ashpd dependencies live under that target's cfg),
# so Windows and macOS dependency graphs and behaviour are unchanged.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png"] }
sys-locale = "0.3"
reqwest = { workspace = true }
minisign-verify = { workspace = true }
fips204 = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
self-replace = "1.5"
percent-encoding = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
# Windows PE resource embedding (icon, product name). winres is a pure-Rust rc
# generator, but it is only ever used by the `CARGO_CFG_TARGET_OS == windows`
# branch of build.rs — scoping it here keeps it out of the macOS/Linux builds.
winres = "0.1"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
zip = { version = "8", default-features = false, features = ["deflate"] }
windows = { version = "0.62", features = [
  "Foundation",
  "ApplicationModel",
  "Services_Store",
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# The `windows` crate disables windows-future's `std` feature, which is where
# the Future/IntoFuture impls for IAsyncOperation live — re-enable it so the
# Store updater can await async WinRT calls instead of blocking the UI thread.
#
# The 0.62 pin originally came from `wgpu-hal`, which required it while
# `gpu-allocator` accepted `>=0.53, <=0.62`: Cargo reuses whichever copy is
# already in the graph, so pinning 0.61 made `gpu-allocator`'s `ID3D12Device` a
# *different type* from the one wgpu-hal passed in (E0308 inside wgpu-hal). wgpu
# left the graph together with the FemtoVG/wgpu renderer variant, but 0.62 is what
# the rest of the graph already resolves to (`accesskit_windows`, `fontique`, …),
# so the pin stands until a dependency refresh has a reason to move it.
windows-future = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(not(windows))'.dependencies]
flate2 = "1"
tar = "0.4"

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# In-process UI testing: drives the real `MainWindow` (element queries, simulated
# clicks and keystrokes, accessibility actions) with no window and no event loop.
#
# Note there is no `internal`/`renderer-skia` feature here on purpose: the
# published crate's `internal` feature cannot compile (its `configure_test_fonts`
# does `include_dir!` on a path that only exists inside the Slint workspace), and
# the input helpers it would provide are two lines over the public
# `Window::dispatch_event` — see `src/ui_tests/mod.rs`. In-process *screenshots*
# would need it, so pixels stay on the L2/MCP path.
#
# Version-pinned with `slint`/`slint-build` in the workspace table.
i-slint-backend-testing = { workspace = true }
# The recording `DownloadBackend` in `src/ui_tests/` implements the core trait,
# which is `#[async_trait]`.
async-trait = { workspace = true }
