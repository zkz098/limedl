name: Release

# Desktop releases ship the Slint client (crates/limedl-native) only — the Tauri
# edition is no longer built or uploaded. Tauri installs therefore stop receiving
# updates (`latest.json` is not published anymore) and their updater will report
# a failure once a newer release exists; see the migration notes in
# .opencode/guides/subsystem-self-update.md.
#
# Windows is currently the only desktop channel: macOS/Linux users are served by
# the NAS build (`limedl-server` + the bundled WebUI) until native packaging for
# those platforms exists.
#
# Speed notes:
# - Caching follows ci.yml's contract (`cache: false` on setup-rust-toolchain
#   because it caches internally, `rustflags: ""` so `.cargo/config.toml` drives
#   the build). The desktop job reuses the `release-native-windows-x86_64`
#   rust-cache entry that `.github/workflows/warm-release-cache.yml` keeps warm on
#   main; without it this job was a cold 16-minute Slint/Skia rebuild.
# - The WebUI is built once in `build-frontend` and shared with all four NAS legs
#   through an artifact instead of being rebuilt on each runner.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Changelog — generate GitHub release notes from Conventional Commits
  # between the previous tag and the released tag (via git-cliff + cliff.toml).
  # The body is exposed as a job output consumed by the upload steps below.
  # ═══════════════════════════════════════════════════════════════════════
  changelog:
    name: Generate release notes
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history + tags so git-cliff can diff the previous release range.
          fetch-depth: 0
          fetch-tags: true

      - name: Compute previous tag
        id: prev
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          PREV="$(git tag --sort=-v:refname | grep -vx "v${VERSION}" | head -n1 || true)"
          echo "PREV=${PREV:-}" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: git-cliff

      - name: Generate release notes
        id: changelog
        shell: bash
        run: |
          RANGE=""
          if [ -n "${{ steps.prev.outputs.PREV }}" ]; then
            RANGE="${{ steps.prev.outputs.PREV }}..${{ github.ref_name }}"
          fi
          BODY="$(git-cliff --config cliff.toml --strip header $RANGE 2>/dev/null || true)"
          if [ -z "$BODY" ]; then
            echo "git-cliff produced an empty changelog." >&2
            BODY="No changelog entries for ${{ github.ref_name }}."
          fi
          echo "=== Generated release notes ==="
          echo "$BODY"
          {
            echo 'body<<GCLIFF_EOF'
            echo "$BODY"
            echo 'GCLIFF_EOF'
          } >> "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════════════════════════════════
  # WebUI — built once (NAS mode) and handed to every NAS leg below. The build
  # is platform independent, so building it four times only multiplied install
  # and Vite time by four.
  # ═══════════════════════════════════════════════════════════════════════
  build-frontend:
    name: Build WebUI (NAS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-release-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-release-${{ runner.os }}-

      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build:nas

      - name: Upload built WebUI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nas-webui-dist
          path: dist/
          # Build input, not a release artifact — no point keeping it around.
          retention-days: 1
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════
  # Desktop (Slint) — the only desktop channel: portable zip + NSIS installer
  # + MSIX package. All artifacts are minisign-signed with the shared updater
  # key so the self-updater (latest-native.json) can verify downloads.
  # ═══════════════════════════════════════════════════════════════════════
  build-native:
    name: Desktop (Slint) windows-x86_64
    runs-on: windows-latest
    needs: changelog
    permissions:
      contents: write
    env:
      # minisign keypair for the self-update channel (verified by
      # crates/limedl-native/src/update.rs). The TAURI_* names are the retired
      # Tauri pipeline's secrets, still read so releases keep working until the
      # secrets are renamed: `cargo xtask generate-key` prints the gh commands.
      LIMEDL_SIGNING_KEY: ${{ secrets.LIMEDL_SIGNING_KEY || secrets.TAURI_SIGNING_PRIVATE_KEY }}
      LIMEDL_SIGNING_KEY_PASSWORD: ${{ secrets.LIMEDL_SIGNING_KEY_PASSWORD || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # ── Rust toolchain ─────────────────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""

      # Shared with .github/workflows/warm-release-cache.yml: that workflow keeps
      # this entry warm on main, this job refreshes it whenever it has to build
      # more than the cache held (rust-cache keys stay job-independent thanks to
      # `add-job-id-key: false`, so a version bump only costs the rebuild of the
      # crates that actually changed).
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-native-windows-x86_64
          add-job-id-key: false

      # ── MiSans VF (embedded at compile time; not in git) ─────────────
      - name: Cache bundled MiSans VF font
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: crates/limedl-native/assets/fonts/MiSansVF.ttf
          key: misans-vf-${{ runner.os }}-0ddef906
      - name: Fetch MiSans VF font
        shell: pwsh
        run: pwsh scripts/fetch-misans.ps1

      - name: Build limedl-native
        shell: pwsh
        run: cargo build --locked --release -p limedl-native

      # ── Assemble dist/ ──────────────────────────────────────────────────
      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/limedl-native.exe dist/

      # ── Portable zip ────────────────────────────────────────────
      # 7z at -mx9 keeps the archive a plain zip/deflate (Explorer-native,
      # zip-crate-decodable) while squeezing ~4% more than Compress-Archive.
      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $out = "limedl-native-v$version-windows-x86_64-portable.zip"
          Push-Location dist
          $sevenZip = "C:\\Program Files\\7-Zip\\7z.exe"
          if (-not (Test-Path $sevenZip)) { throw "7z.exe not found" }
          & $sevenZip a -tzip -mx9 $out limedl-native.exe -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw "7z failed with $LASTEXITCODE" }
          Pop-Location
          Write-Host "wrote dist/$out"

      # ── NSIS installer ─────────────────────────────────────────────────
      # makensis resolves `File` relative to the .nsi file's own directory, so
      # the script takes the staged binary path as an absolute input
      # (/DAPP_EXE_PATH) instead of looking for it next to itself.
      - name: Package NSIS installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          choco install nsis -y --no-progress
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "makensis not found" }
          if (-not (Test-Path dist/limedl-native.exe)) { throw "dist/limedl-native.exe missing" }
          # Force UTF-8: the script's comments contain non-ASCII box-drawing
          # characters. Without this, makensis decodes the file with the
          # runner's ANSI code page (CP1252 happens to accept those bytes,
          # CP936 aborts with "Bad text encoding"), so a BOM-less edit would
          # pass CI and break local builds.
          & $makensis `
            /INPUTCHARSET UTF8 `
            "/DVERSION=$version" `
            "/DOUTFILE=$PWD\dist\limedl-native-v$version-windows-x86_64-setup.exe" `
            "/DAPP_EXE_PATH=$PWD\dist\limedl-native.exe" `
            installer\limedl-native.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }

      # ── MSIX package ────────────────────────────────────────────────────
      - name: Package MSIX
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $ErrorActionPreference = "Stop"

          $staging = "packaging/msix/staging"
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Force -Path "$staging/Assets" | Out-Null

          Copy-Item dist/limedl-native.exe $staging/
          pwsh scripts/gen-msix-assets.ps1 -OutDir "$staging/Assets"

          # MSIX versions are strictly a.b.c.d (numeric only) — drop any
          # prerelease suffix from the tag.
          $numeric = ($version -split '-')[0]
          $msixVersion = "$numeric.0"

          $manifest = Get-Content packaging/msix/AppxManifest.xml -Raw
          $manifest = $manifest `
            -replace '__VERSION__', $msixVersion `
            -replace '__MSIX_IDENTITY_NAME__', $env:MSIX_IDENTITY_NAME `
            -replace '__MSIX_PUBLISHER__', $env:MSIX_PUBLISHER
          [System.IO.File]::WriteAllText("$staging/AppxManifest.xml", $manifest, (New-Object System.Text.UTF8Encoding($false)))

          # Locate the newest Windows SDK's MakeAppx.
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^10\.\d' } |
            Sort-Object -Property Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\makeappx.exe" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found" }

          & $makeappx pack /d $staging /p "dist\limedl-native-v$version-windows-x86_64.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed with $LASTEXITCODE" }
        env:
          MSIX_IDENTITY_NAME: Zkz20.limedl-native
          MSIX_PUBLISHER: "CN=zkz098"

      # ── Sign + verify (minisign, in-repo tooling) ──────────────────────
      # `sign` writes <file>.sig; `guard` re-verifies every signature and
      # refuses to continue unless LIMEDL_SIGNING_KEY matches the PUBKEY_B64
      # embedded in the client (a rotated secret with a stale constant would
      # otherwise ship an app that rejects all future updates).
      - name: Sign artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          cargo xtask sign `
            "dist/limedl-native-v$version-windows-x86_64-setup.exe" `
            "dist/limedl-native-v$version-windows-x86_64-portable.zip" `
            "dist/limedl-native-v$version-windows-x86_64.msix"
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }

      # ── Self-update manifest (signed as well) ──────────────────────────
      - name: Generate latest-native.json
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          pwsh scripts/gen-native-manifest.ps1 `
            -Version $version `
            -SetupExe "dist/limedl-native-v$version-windows-x86_64-setup.exe" `
            -PortableZip "dist/limedl-native-v$version-windows-x86_64-portable.zip" `
            -Notes @'
          ${{ needs.changelog.outputs.body }}
          '@ `
            -OutFile dist/latest-native.json

      - name: Sign the manifest and run the release guard
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          cargo xtask sign dist/latest-native.json
          if ($LASTEXITCODE -ne 0) { throw "signing the manifest failed" }
          cargo xtask guard `
            "dist/limedl-native-v$version-windows-x86_64-setup.exe" `
            "dist/limedl-native-v$version-windows-x86_64-portable.zip" `
            "dist/limedl-native-v$version-windows-x86_64.msix" `
            "dist/latest-native.json"
          if ($LASTEXITCODE -ne 0) { throw "release guard failed" }

      # ── Upload to release ──────────────────────────────────────────────
      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            dist/limedl-native-v*-windows-x86_64-setup.exe
            dist/limedl-native-v*-windows-x86_64-setup.exe.sig
            dist/limedl-native-v*-windows-x86_64-portable.zip
            dist/limedl-native-v*-windows-x86_64-portable.zip.sig
            dist/limedl-native-v*-windows-x86_64.msix
            dist/limedl-native-v*-windows-x86_64.msix.sig
            dist/latest-native.json
            dist/latest-native.json.sig
          body: ${{ needs.changelog.outputs.body }}
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # NAS Server — single binary with embedded frontend
  # ═══════════════════════════════════════════════════════════════════════
  build-nas:
    name: NAS ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: [changelog, build-frontend]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: tar.gz
            binary: limedl

          - name: linux-aarch64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            ext: tar.gz
            binary: limedl

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
            binary: limedl.exe

          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
            binary: limedl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # ── Frontend (built once by build-frontend, embedded via rust-embed) ──
      # crates/limedl-server/src/main.rs embeds `../../dist`.
      - name: Download built WebUI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nas-webui-dist
          path: dist

      # ── Rust toolchain ─────────────────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-nas-${{ matrix.target }}

      # ── musl toolchain (Linux only) ────────────────────────────────────
      - name: Install musl target
        if: contains(matrix.target, 'musl')
        run: |
          rustup target add ${{ matrix.target }}
          sudo apt-get update && sudo apt-get install -y musl-tools

      # ── Build server binary (NAS: x86-64-v2 for broad HW compat) ──────
      # `.cargo/config.toml` already targets x86-64-v2 for the musl targets;
      # the MSVC target is pinned to x86-64-v3 there for the desktop build, so
      # the NAS binary overrides it back to v2 for older NAS CPUs.
      - name: Build binary
        env:
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-cpu=x86-64-v2' || '' }}
        run: cargo build --locked --release --target ${{ matrix.target }} --features embed-frontend --manifest-path crates/limedl-server/Cargo.toml

      # ── Package ────────────────────────────────────────────────────────
      - name: Package (Linux / macOS)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NAME="${{ matrix.name }}"
          BINARY="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          ASSET="limedl-nas-v${VERSION}-${NAME}.tar.gz"
          cp "$BINARY" limedl-nas
          tar -czf "$ASSET" limedl-nas
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.VERSION }}"
          $NAME = "${{ matrix.name }}"
          $BINARY = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          $ASSET = "limedl-nas-v${VERSION}-${NAME}.zip"
          Compress-Archive -Path $BINARY -DestinationPath $ASSET
          echo "ASSET=$ASSET" >> $env:GITHUB_ENV

      # ── Upload to release ──────────────────────────────────────────────
      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: ${{ env.ASSET }}
          body: ${{ needs.changelog.outputs.body }}
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
