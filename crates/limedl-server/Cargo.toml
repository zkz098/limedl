[package]
name = "limedl-server"
version.workspace = true
description = "Headless download daemon and CLI for limedl — axum HTTP/WebSocket JSON-RPC server"
license.workspace = true
edition = "2024"

[[bin]]
name = "limedl"
path = "src/main.rs"

[lib]
name = "limedl_server"
path = "src/lib.rs"

[features]
default = []
tls = ["axum-server"]
embed-frontend = ["dep:rust-embed"]

[dependencies]
limedl-core = { path = "../limedl-core", features = ["aria2-rpc"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
tower-http = { version = "0.7", features = [
  "fs",
  "set-header",
  "limit",
  "compression-gzip",
  "compression-br",
  "compression-zstd",
] }
governor = "0.10"
nonzero_ext = "0.3"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std"] }
parking_lot = "0.12"
futures-util = "0.3"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rust-embed = { version = "8", optional = true }
tower = { version = "0.5", default-features = false, features = ["util"] }

[dev-dependencies]
limedl-core = { path = "../limedl-core", features = ["test-utils"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
serde_json = "1"
ntest = "0.9"
tokio-tungstenite = "0.30"
futures-util = "0.3"
