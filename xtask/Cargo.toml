[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
license.workspace = true
description = "Repository tooling: signing/guards, update manifest, MiSans font fetch, version bump"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
# Raw deflate decode for the MiSans zip entry; same version limedl-native uses,
# so the shared build graph does not gain a second compression backend.
flate2 = "1"
# Pure-Rust image decoder/resizer for cross-platform icon generation
image = { version = "0.25", default-features = false, features = ["png"] }
minisign = "0.9"
# Version bumping edits Cargo.toml/Cargo.lock/website with the same anchored
# patterns the retired scripts used; regex keeps that contract legible.
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# SHA-256 for the update manifest (and the pinned font hash check).
sha2 = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
minisign-verify = { workspace = true }
