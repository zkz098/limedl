[package]
name = "limedl-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Kept out of the root workspace (`exclude = ["fuzz"]`) so `ci_parity` does not
# expect a nextest/llvm-cov line for it. Run with:
#   RUSTFLAGS="--cfg reqwest_unstable" cargo +nightly fuzz run <target> -- -max_total_time=60
#
# The RUSTFLAGS prefix is required because cargo-fuzz drives the build through
# RUSTFLAGS, which overrides the root `.cargo/config.toml`; reqwest's `http3`
# feature (enabled by the workspace dependency) hard-requires that cfg.
[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
serde_json = "1"
http = "1"
limedl-types = { path = "../crates/limedl-types", default-features = false }
limedl-http = { path = "../crates/limedl-http" }
limedl-engine = { path = "../crates/limedl-engine", default-features = false }
limedl-bt = { path = "../crates/limedl-bt" }
limedl-rpc = { path = "../crates/limedl-rpc" }

[[bin]]
name = "sha256_manifest"
path = "fuzz_targets/sha256_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metalink_xml"
path = "fuzz_targets/metalink_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "settings_json"
path = "fuzz_targets/settings_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rpc_options"
path = "fuzz_targets/rpc_options.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metalink_headers"
path = "fuzz_targets/metalink_headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "url_rewrite_and_name"
path = "fuzz_targets/url_rewrite_and_name.rs"
test = false
doc = false
bench = false

[[bin]]
name = "aria2_cli_and_batch"
path = "fuzz_targets/aria2_cli_and_batch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_headers"
path = "fuzz_targets/http_headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rpc_envelope"
path = "fuzz_targets/rpc_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bt_inputs"
path = "fuzz_targets/bt_inputs.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
