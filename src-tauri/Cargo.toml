[package]
name = "downloader"
version = "0.1.0"
description = "Tauri v2 desktop download manager — HTTP, BitTorrent, Metalink, SFTP"
authors = ["downloader contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The _lib suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "downloader_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "http2"] }
futures-util = "0.3"
blake3 = "1"
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sanitize-filename = "0.5"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
urlencoding = "2"
tauri-plugin-dialog = "2"
mimalloc = "0.1.48"
fs4 = { version = "0.13", features = ["sync"] }
librqbit = "8.1.1"
ssh2 = "0.9"
anyhow = "1"
time = ">=0.3.2, <0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
base64 = "0.22"
rusqlite = { version = "0.34", features = ["bundled"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
ntest = "0.9"
