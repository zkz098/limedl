[package]
name = "limedl-http"
version.workspace = true
description = "HTTP transport policy for limedl — client construction (proxy/TLS/HTTP-3), identity encoding, url→header helpers and the token-bucket rate limiter"
license.workspace = true
edition = "2024"
# Workspace-internal, like every other limedl crate.
publish = false

[lib]
name = "limedl_http"

[dependencies]
# The whole point of this crate: every `reqwest` policy the engine has opinions
# about lives behind this one boundary (proxy modes, the identity-encoding rule
# for range requests, the HTTP/3 toggle), so `limedl-bt`, `limedl-engine` and the
# CDN accelerator share the same client instead of each building their own.
limedl-types = { path = "../limedl-types", default-features = false }
reqwest = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
percent-encoding = { workspace = true }
sanitize-filename = { workspace = true }
time = { workspace = true }

[features]
# `rate_limiter` exposes its occupancy counters to the engine's tests only.
default = []
test-utils = []

[dev-dependencies]
criterion = { workspace = true }
ntest = { workspace = true }
futures-util = { workspace = true }
# `http::tests` builds `reqwest`-shaped responses out of `axum::http`.
axum = { workspace = true }

# The bench drives the token bucket the way the engine does (`set_tokens`,
# `capacity`, `consume_blocking`), and those live behind `test-utils` — they are
# the seam the scheduler tests use, not production API. Hence the feature and
# hence `required-features`, so a plain `cargo bench` does not try to build the
# bench against a crate where the methods do not exist.
[[bench]]
name = "rate_limiter"
harness = false
required-features = ["test-utils"]
