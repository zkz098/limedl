name: Release

# Desktop releases ship the Slint client (crates/limedl-native) only — the Tauri
# edition is no longer built or uploaded. Tauri installs therefore stop receiving
# updates (`latest.json` is not published anymore) and their updater will report
# a failure once a newer release exists; see the migration notes in
# docs/update-signing-key.md.
#
# Desktop channels: Windows (NSIS installer + portable zip + MSIX), macOS
# (ad-hoc-signed, un-notarized `.app` in a tar.gz) and Linux (binary in a tar.gz).
# They are handled by `build-native` / `build-native-macos` / `build-native-linux`,
# which upload their artifacts, and then `native-manifest` merges them into the
# single signed `latest-native.json` the clients poll. The merge is a separate job
# because the manifest is one file: letting each platform job generate it would
# make the last job to finish overwrite the other platforms' entries.
#
# Speed notes:
# - Caching follows ci.yml's contract (`cache: false` on setup-rust-toolchain
#   because it caches internally, `rustflags: ""` so `.cargo/config.toml` drives
#   the build).
# - The desktop legs are deliberately uncached. They used to restore
#   `release-native-*` entries that `.github/workflows/warm-release-cache.yml`
#   kept warm on main, but that workflow cost ~50 min of runner time on every
#   crates push while the measured release saving was ~0 on Windows (13m05s warm
#   vs 13m16s cold — the leg is link-bound, not dependency-bound) and only
#   4-9 min on macOS. rust-cache caches dependencies and never the workspace
#   crates, so even a source-only push could not refresh the entry — it just
#   rebuilt the binary for nothing. The workflow was removed; a tagged release
#   now pays a cold build (v0.4.0 measured 1481 s of `cargo build --release
#   -p limedl-native` on macOS when fully cold).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # MiSans VF font — one fetcher for the whole release.
  #
  # The font is embedded at compile time and cannot be committed (MiSans
  # license). Each platform job used to run its own cache+download pair, so a
  # cold cache meant three runners hitting Xiaomi's CDN at once and a CDN outage
  # could fail a tagged release three times over. Fetch once (on the cheapest
  # runner — the artifact is a plain .ttf, the OS does not matter), then hand it
  # to the platform jobs.
  # ═══════════════════════════════════════════════════════════════════════
  font:
    name: MiSans VF font
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # `fetch-font` is part of xtask now, so the one job that talks to Xiaomi's
      # CDN needs the Rust toolchain. No rust-cache here on purpose: it would
      # only cache the registry for the single xtask binary this job builds.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""
      - uses: ./.github/actions/fetch-misans
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: misans-vf
          path: crates/limedl-native/assets/fonts/MiSansVF.ttf
          retention-days: 1
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════
  # Changelog — generate GitHub release notes from Conventional Commits
  # between the previous tag and the released tag (via git-cliff + cliff.toml).
  # The body is exposed as a job output consumed by the upload steps below.
  # ═══════════════════════════════════════════════════════════════════════
  changelog:
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history + tags so git-cliff can diff the previous release range.
          fetch-depth: 0
          fetch-tags: true

      - name: Compute previous tag
        id: prev
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          PREV="$(git tag --sort=-v:refname | grep -vx "v${VERSION}" | head -n1 || true)"
          echo "PREV=${PREV:-}" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: git-cliff

      - name: Generate release notes
        id: changelog
        shell: bash
        run: |
          RANGE=""
          if [ -n "${{ steps.prev.outputs.PREV }}" ]; then
            RANGE="${{ steps.prev.outputs.PREV }}..${{ github.ref_name }}"
          fi
          BODY="$(git-cliff --config cliff.toml --strip header $RANGE 2>/dev/null || true)"
          if [ -z "$BODY" ]; then
            echo "git-cliff produced an empty changelog." >&2
            BODY="No changelog entries for ${{ github.ref_name }}."
          fi
          echo "=== Generated release notes ==="
          echo "$BODY"
          {
            echo 'body<<GCLIFF_EOF'
            echo "$BODY"
            echo 'GCLIFF_EOF'
          } >> "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════════════════════════════════
  # Desktop (Slint) — Windows: portable zip + NSIS installer + MSIX package.
  # All artifacts are minisign-signed by the `native-manifest` job with the
  # shared updater key, so the self-updater (latest-native.json) can verify
  # downloads.
  # ═══════════════════════════════════════════════════════════════════════
  build-native:
    name: Desktop app (windows-x86_64)
    runs-on: windows-latest
    needs: [changelog, font]
    permissions:
      contents: write
    env:
      # minisign keypair for the self-update channel (verified by
      # crates/limedl-native/src/update/mod.rs). `cargo xtask generate-key` prints
      # the `gh secret set` commands.
      LIMEDL_SIGNING_KEY: ${{ secrets.LIMEDL_SIGNING_KEY }}
      LIMEDL_SIGNING_KEY_PASSWORD: ${{ secrets.LIMEDL_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Windows Defender's real-time scanner inspects every file cargo writes
      # into target/ (multi-GB per run) — the dominant Windows-vs-Linux penalty
      # we can remove for free. Best-effort: a runner policy change must not fail
      # the build, so failures are swallowed and only the resulting state is
      # logged.
      - name: Exclude build paths from Defender real-time scanning
        shell: pwsh
        run: |
          foreach ($path in @($env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", $env:RUNNER_TEMP)) {
            Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
          }
          if ($status = Get-MpComputerStatus -ErrorAction SilentlyContinue) {
            Write-Host "Defender real-time protection enabled: $($status.RealTimeProtectionEnabled)"
          }

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # ── Rust toolchain ─────────────────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""

      # ── MiSans VF (embedded at compile time; not in git) ─────────────
      - name: Restore bundled MiSans VF font
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: misans-vf
          path: crates/limedl-native/assets/fonts/
      - uses: ./.github/actions/fetch-misans
        with:
          mode: verify

      - name: Build limedl-native
        shell: pwsh
        run: cargo build --locked --release -p limedl-native

      # ── Assemble dist/ ──────────────────────────────────────────────────
      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/limedl-native.exe dist/

      # ── Portable zip ────────────────────────────────────────────
      # 7z at -mx9 keeps the archive a plain zip/deflate (Explorer-native,
      # zip-crate-decodable) while squeezing ~4% more than Compress-Archive.
      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $out = "limedl-native-v$version-windows-x86_64-portable.zip"
          Push-Location dist
          $sevenZip = "C:\\Program Files\\7-Zip\\7z.exe"
          if (-not (Test-Path $sevenZip)) { throw "7z.exe not found" }
          & $sevenZip a -tzip -mx9 $out limedl-native.exe -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw "7z failed with $LASTEXITCODE" }
          Pop-Location
          Write-Host "wrote dist/$out"

      # ── NSIS installer ─────────────────────────────────────────────────
      # makensis resolves `File` relative to the .nsi file's own directory, so
      # the script takes the staged binary path as an absolute input
      # (/DAPP_EXE_PATH) instead of looking for it next to itself.
      - name: Setup NSIS
        uses: repolevedavaj/install-nsis@65a75ea79c3d1ddde868e98b7f9447e2e623401c # v1.3.0
        with:
          nsis-version: '3.10'

      - name: Package NSIS installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
          if (-not $makensis -and (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not $makensis) { throw "makensis not found" }
          if (-not (Test-Path dist/limedl-native.exe)) { throw "dist/limedl-native.exe missing" }
          # Force UTF-8: the script's comments contain non-ASCII box-drawing
          # characters. Without this, makensis decodes the file with the
          # runner's ANSI code page (CP1252 happens to accept those bytes,
          # CP936 aborts with "Bad text encoding"), so a BOM-less edit would
          # pass CI and break local builds.
          & $makensis `
            /INPUTCHARSET UTF8 `
            "/DVERSION=$version" `
            "/DOUTFILE=$PWD\dist\limedl-native-v$version-windows-x86_64-setup.exe" `
            "/DAPP_EXE_PATH=$PWD\dist\limedl-native.exe" `
            installer\limedl-native.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }

      # ── MSIX package ────────────────────────────────────────────────────
      - name: Package MSIX
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $ErrorActionPreference = "Stop"

          $staging = "packaging/msix/staging"
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Force -Path "$staging/Assets" | Out-Null

          Copy-Item dist/limedl-native.exe $staging/
          cargo xtask gen-icons msix --out-dir "$staging/Assets"

          # MSIX versions are strictly a.b.c.d (numeric only) — drop any
          # prerelease suffix from the tag.
          $numeric = ($version -split '-')[0]
          $msixVersion = "$numeric.0"

          $manifest = Get-Content packaging/msix/AppxManifest.xml -Raw
          $manifest = $manifest `
            -replace '__VERSION__', $msixVersion `
            -replace '__MSIX_IDENTITY_NAME__', $env:MSIX_IDENTITY_NAME `
            -replace '__MSIX_PUBLISHER__', $env:MSIX_PUBLISHER
          [System.IO.File]::WriteAllText("$staging/AppxManifest.xml", $manifest, (New-Object System.Text.UTF8Encoding($false)))

          # Locate the newest Windows SDK's MakeAppx.
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^10\.\d' } |
            Sort-Object -Property Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\makeappx.exe" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found" }

          & $makeappx pack /d $staging /p "dist\limedl-native-v$version-windows-x86_64.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed with $LASTEXITCODE" }
        env:
          MSIX_IDENTITY_NAME: Zkz20.limedl-native
          MSIX_PUBLISHER: "CN=zkz098"

      # ── Sign + verify (minisign, in-repo tooling) ──────────────────────
      # ── Hand the binaries to `native-manifest` ──────────────────────────
      # The manifest job can only advertise an artifact it can see, so the
      # binaries travel between jobs as artifacts (unsigned; the minisign
      # signatures stay a sidecar produced in the manifest job, where the
      # signing secret lives).
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-windows-x86_64
          path: |
            dist/limedl-native-v*-windows-x86_64-setup.exe
            dist/limedl-native-v*-windows-x86_64-portable.zip
            dist/limedl-native-v*-windows-x86_64.msix
          if-no-files-found: error

      # Minisign signing, the self-update manifest and the release guard all run
      # in the `native-manifest` job below — the manifest is a single file that
      # must carry every platform's entries, so no per-platform job may write it.

      # ── Upload to release (Windows assets only) ────────────────────────
      # The manifest is deliberately absent: it is produced AFTER this job, by
      # `native-manifest`. `softprops/action-gh-release` creates the release when
      # it does not exist yet, which is what lets the parallel desktop jobs
      # publish their files without a serialization point.
      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            dist/limedl-native-v*-windows-x86_64-setup.exe
            dist/limedl-native-v*-windows-x86_64-portable.zip
            dist/limedl-native-v*-windows-x86_64.msix
          body: ${{ needs.changelog.outputs.body }}
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # Desktop (Slint) — macOS: ad-hoc-signed `.app` in a tar.gz.
  #
  # aarch64 only: `macos-latest` is an Apple-silicon runner, and the bundle is
  # built natively there (no cross-compile). An Intel leg (`macos-13`) is a
  # separate `darwin-x86_64-portable` manifest key when it is wanted.
  #
  # Not notarized by design (see scripts/package-macos.sh): no Apple Developer
  # account is involved yet, so a browser-downloaded copy needs right-click →
  # Open on first launch. Everything else (bundle identity, Dock tile, status
  # item, notification attribution) works, and the self-updater re-applies the
  # ad-hoc signature after replacing the binary (update.rs).
  # ═══════════════════════════════════════════════════════════════════════
  build-native-macos:
    name: Desktop app (darwin-aarch64)
    runs-on: macos-latest
    needs: [changelog, font]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # ── Rust toolchain ─────────────────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""

      # ── MiSans VF (embedded at compile time; not in git) ──────────────
      - name: Restore bundled MiSans VF font
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: misans-vf
          path: crates/limedl-native/assets/fonts/
      - uses: ./.github/actions/fetch-misans
        with:
          mode: verify

      - name: Build limedl-native
        shell: bash
        run: cargo build --locked --release -p limedl-native

      # ── Assemble + ad-hoc sign + archive the .app bundle ───────────────
      - name: Package app bundle
        shell: bash
        run: |
          bash scripts/package-macos.sh \
            --version "${{ steps.version.outputs.VERSION }}" \
            --binary target/release/limedl-native \
            --out-dir dist \
            --icon crates/limedl-native/ui/assets/icon.png \
            --arch aarch64

      # ── Hand the bundle to `native-manifest` ───────────────────────────
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-darwin-aarch64
          path: dist/limedl-native-v*-darwin-aarch64-portable.tar.gz
          if-no-files-found: error

      # ── Upload to release (macOS asset only — manifest is built later) ──
      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            dist/limedl-native-v*-darwin-aarch64-portable.tar.gz
            dist/limedl-native-v*-darwin-aarch64-portable.tar.gz.sig
          body: ${{ needs.changelog.outputs.body }}
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # Desktop (Slint) — Linux: plain binary in a tar.gz.
  #
  # `x86_64-unknown-linux-gnu.2.17` (the cargo-zigbuild glibc-version target),
  # not musl: the Slint build links system libraries (fontconfig is a direct
  # DT_NEEDED; X11/Wayland/GL are loaded at runtime) and cannot be a static musl
  # binary — a static binary has no dynamic loader to open the distro's GPU
  # drivers. glibc-version targeting keeps the dynamic system libraries while
  # making the linker resolve the binary's *own* libc references against glibc
  # 2.17, which is Rust's minimum for the gnu target. That lowers the floor from
  # the runner's glibc (Ubuntu 24.04 = 2.39) to 2.17, so the build runs on
  # Debian 10 / Ubuntu 18.04 / CentOS 7 and similar. The `check-glibc-floor`
  # step fails the release if a dependency ever drags the floor back up.
  #
  # No GTK headers at build time and no GTK at runtime: the tray uses
  # tray-icon's `ksni` backend (pure-Rust StatusNotifierItem over D-Bus) and
  # the file dialogs use `xdg-portal`. What remains is `libfontconfig1-dev`:
  # Slint's font stack probes pkg-config for fontconfig
  # (`yeslogic-fontconfig-sys`), and the binary links `libfontconfig.so.1`.
  # The runtime requirements are that plus a session D-Bus and a
  # StatusNotifier host (GNOME: AppIndicator extension).
  # ═══════════════════════════════════════════════════════════════════════
  build-native-linux:
    name: Desktop app (linux-x86_64)
    runs-on: ubuntu-latest
    needs: [changelog, font]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Slint's font stack probes pkg-config for fontconfig
      # (`yeslogic-fontconfig-sys`); no GTK package is involved.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""

      # ── MiSans VF (embedded at compile time; not in git) ──────────────
      - name: Restore bundled MiSans VF font
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: misans-vf
          path: crates/limedl-native/assets/fonts/
      - uses: ./.github/actions/fetch-misans
        with:
          mode: verify

      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-zigbuild

      # zig ships in the PyPI `ziglang` wheel. The wheel has no `zig` console
      # script, so symlink the packaged binary onto PATH for cargo-zigbuild.
      - name: Install zig
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages --only-binary ":all:" "ziglang==0.16.0"
          ZIG_DIR="$(python3 -c 'import os, ziglang; print(os.path.dirname(ziglang.__file__))')"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$ZIG_DIR/zig" "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/zig" version

      - name: Build limedl-native (glibc 2.17 floor)
        shell: bash
        run: |
          cargo zigbuild --locked --release \
            --target x86_64-unknown-linux-gnu.2.17 \
            -p limedl-native

      - name: Verify the glibc symbol floor
        shell: bash
        run: bash scripts/check-glibc-floor.sh --binary target/x86_64-unknown-linux-gnu/release/limedl-native --max 2.17

      - name: Package Linux artifacts
        shell: bash
        run: |
          BINARY=target/x86_64-unknown-linux-gnu/release/limedl-native

          bash scripts/package-linux.sh \
            --version "${{ steps.version.outputs.VERSION }}" \
            --binary "$BINARY" \
            --out-dir dist \
            --arch x86_64

          bash scripts/package-deb.sh \
            --version "${{ steps.version.outputs.VERSION }}" \
            --binary "$BINARY" \
            --out-dir dist \
            --arch x86_64

          bash scripts/package-appimage.sh \
            --version "${{ steps.version.outputs.VERSION }}" \
            --binary "$BINARY" \
            --out-dir dist \
            --arch x86_64

      # ── Hand the artifacts to `native-manifest` ───────────────────────
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-linux-x86_64
          path: |
            dist/limedl-native-v*-linux-x86_64-portable.tar.gz
            dist/limedl-native-v*-linux-x86_64.deb
            dist/limedl-native-v*-linux-x86_64.AppImage
          if-no-files-found: error

      # ── Upload to release (Linux assets only — manifest is built later) ──
      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            dist/limedl-native-v*-linux-x86_64-portable.tar.gz
            dist/limedl-native-v*-linux-x86_64.deb
            dist/limedl-native-v*-linux-x86_64.AppImage
          body: ${{ needs.changelog.outputs.body }}
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # Headless server (NAS / 软路由) — static musl Linux binaries.
  #
  # `limedl-server` has no Slint/GTK/fontconfig dependency, so unlike the
  # desktop legs it can ship as a fully static musl binary. Only the two
  # supported targets are built: x86_64 (x86-64-v2 for broad NAS compatibility —
  # see .cargo/config.toml) and aarch64.
  #
  # `cargo zigbuild` supplies the musl C toolchain that `aws-lc-sys` (pulled
  # through the pinned `irontide` engine) needs to compile its C sources; a plain
  # `cargo build --target *-musl` on the runner cannot link those. It is used
  # instead of `cross` because it needs no Docker and both targets were verified
  # locally to produce stripped, statically-linked binaries. zig itself comes
  # from the PyPI `ziglang` wheel (the wheel's `zig` has no console-script entry,
  # so it is symlinked onto PATH).
  #
  # The server artifacts are plain release assets — they are not part of the
  # self-update manifest and are therefore neither signed nor guarded.
  # ═══════════════════════════════════════════════════════════════════════
  build-server:
    name: Server (${{ matrix.arch }} linux-musl)
    runs-on: ubuntu-latest
    needs: [changelog]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-zigbuild

      # zig ships in the PyPI `ziglang` wheel. The wheel has no `zig` console
      # script, so symlink the packaged binary onto PATH for cargo-zigbuild.
      - name: Install zig
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages --only-binary ":all:" "ziglang==0.16.0"
          ZIG_DIR="$(python3 -c 'import os, ziglang; print(os.path.dirname(ziglang.__file__))')"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$ZIG_DIR/zig" "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/zig" version

      - name: Build limedl-server (${{ matrix.target }})
        run: cargo zigbuild --locked --release --target ${{ matrix.target }} -p limedl-server

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          STAGE="limedl-server-v${VERSION}-${{ matrix.arch }}-linux-musl"
          mkdir -p "dist/${STAGE}"
          cp "target/${{ matrix.target }}/release/limedl-server" "dist/${STAGE}/limedl-server"
          # Ship the service assets inside the archive so a NAS install is one
          # download; docs/server-daemon.md explains how to install them.
          cp packaging/server/systemd/limedl-server.service "dist/${STAGE}/"
          cp packaging/server/systemd/limedl-server.env.example "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: server-${{ matrix.arch }}-linux-musl
          path: dist/limedl-server-v*-linux-musl.tar.gz
          if-no-files-found: error

      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: dist/limedl-server-v*-linux-musl.tar.gz
          body: ${{ needs.changelog.outputs.body }}
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # Container image (GHCR) — publish limedl-server as a multi-arch image.
  #
  # This job does NOT rebuild the engine. It assembles a thin Alpine image
  # around the static musl binaries `build-server` already produced, so the Rust
  # and aws-lc C toolchains never run inside the image build. One image per
  # architecture is pushed, then merged into a single manifest list tagged with
  # <version> and (for a stable release) latest.
  #
  # QEMU is still needed for the arm64 image's Alpine setup layer (`apk add`);
  # tonistiigi/binfmt is the same image docker/setup-qemu-action uses, and the
  # docker-container builder is what makes cross-platform `RUN` work.
  # ═══════════════════════════════════════════════════════════════════════
  server-image:
    name: Server image (GHCR)
    runs-on: ubuntu-latest
    needs: [build-server]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download server binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: server-*-linux-musl
          path: dist
          merge-multiple: true

      - name: Extract the binaries for each architecture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/img/amd64 dist/img/arm64
          tar -xzf dist/limedl-server-v*-x86_64-linux-musl.tar.gz --strip-components=1 -C dist/img/amd64
          tar -xzf dist/limedl-server-v*-aarch64-linux-musl.tar.gz --strip-components=1 -C dist/img/arm64
          file dist/img/amd64/limedl-server dist/img/arm64/limedl-server

      - name: Set up QEMU and a container builder
        shell: bash
        run: |
          set -euo pipefail
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --name limedl --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and push per-architecture images
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          REGISTRY="ghcr.io/zkz098/limedl-server"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          docker buildx build \
            --platform linux/amd64 \
            --file packaging/server/Dockerfile.release \
            --build-arg BINARY=dist/img/amd64/limedl-server \
            --tag "${REGISTRY}:${VERSION}-amd64" \
            --push .

          docker buildx build \
            --platform linux/arm64 \
            --file packaging/server/Dockerfile.release \
            --build-arg BINARY=dist/img/arm64/limedl-server \
            --tag "${REGISTRY}:${VERSION}-arm64" \
            --push .

      - name: Create the multi-architecture manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          REGISTRY="ghcr.io/zkz098/limedl-server"
          # `latest` must not move for an alpha/beta/rc tag.
          TAGS=(--tag "${REGISTRY}:${VERSION}")
          if [ "${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}" != "true" ]; then
            TAGS+=(--tag "${REGISTRY}:latest")
          fi
          docker buildx imagetools create \
            "${TAGS[@]}" \
            "${REGISTRY}:${VERSION}-amd64" \
            "${REGISTRY}:${VERSION}-arm64"

  # ═══════════════════════════════════════════════════════════════════════
  # Native update channel — sign every desktop artifact, build the single
  # `latest-native.json` covering all platforms, sign it, run the guard, and
  # publish.
  #
  # This is the only job that writes the manifest, for the reason in the header:
  # one file cannot be produced independently by two platform jobs without one
  # overwriting the other (and desynchronizing it from its .sig).
  #
  # It runs even when a platform leg failed: a missing platform key is handled
  # gracefully by the client (`UpdateManifest::has_assets_for` reports "no update"
  # instead of an error), whereas skipping the manifest would break updates for
  # the platforms that DID build. A failed leg surfaces as a red check here.
  #
  # `build-server` is in `needs` only to sequence the release page: this job
  # flips `prerelease` to false last, and a server leg still running after it
  # would reset the flag from its own upload.
  # ═══════════════════════════════════════════════════════════════════════
  native-manifest:
    name: Update manifest (native)
    runs-on: windows-latest
    needs: [changelog, build-native, build-native-macos, build-native-linux, build-server]
    if: always()
    permissions:
      contents: write
    env:
      LIMEDL_SIGNING_KEY: ${{ secrets.LIMEDL_SIGNING_KEY }}
      LIMEDL_SIGNING_KEY_PASSWORD: ${{ secrets.LIMEDL_SIGNING_KEY_PASSWORD }}
      LIMEDL_PQC_SIGNING_KEY: ${{ secrets.LIMEDL_PQC_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
          rustflags: ""

      - name: Download Windows desktop artifacts
        if: needs.build-native.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-windows-x86_64
          path: dist

      - name: Download macOS desktop artifacts
        if: needs.build-native-macos.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-darwin-aarch64
          path: dist

      - name: Download Linux desktop artifacts
        if: needs.build-native-linux.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-linux-x86_64
          path: dist

      # ── Minisign & PQC: the update trust chain ─────────────────────────
      # `sign` writes <file>.sig and <file>.pqc.sig for each artifact; `cargo xtask manifest`
      # inlines those signatures into the manifest; `guard` then re-verifies
      # everything AND refuses to continue unless LIMEDL_SIGNING_KEY / LIMEDL_PQC_SIGNING_KEY
      # match the PUBKEY_B64 / PQC_PUBKEY_B64 embedded in the client (a rotated secret with a
      # stale constant would otherwise ship an app that rejects all future updates).
      - name: Sign artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Build the map of manifest key -> artifact from what actually got
          # built, so a skipped platform leg removes its entries instead of
          # pointing clients at a URL that 404s.
          $assets = [ordered]@{}
          if ($env:HAS_WINDOWS -eq 'true') {
            $assets['windows-x86_64'] = [ordered]@{ kind = 'installer'; path = 'dist/limedl-native-v${{ steps.version.outputs.VERSION }}-windows-x86_64-setup.exe' }
            $assets['windows-x86_64-portable'] = [ordered]@{ kind = 'portable'; path = 'dist/limedl-native-v${{ steps.version.outputs.VERSION }}-windows-x86_64-portable.zip' }
          }
          if ($env:HAS_MACOS -eq 'true') {
            $assets['darwin-aarch64-portable'] = [ordered]@{ kind = 'portable'; path = 'dist/limedl-native-v${{ steps.version.outputs.VERSION }}-darwin-aarch64-portable.tar.gz' }
          }
          if ($env:HAS_LINUX -eq 'true') {
            $assets['linux-x86_64-portable'] = [ordered]@{ kind = 'portable'; path = 'dist/limedl-native-v${{ steps.version.outputs.VERSION }}-linux-x86_64-portable.tar.gz' }
          }
          if ($assets.Count -eq 0) { throw "no desktop artifacts were downloaded — nothing to sign" }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $assets | ConvertTo-Json -Depth 4 | Set-Content dist/native-assets.json -Encoding utf8
          Get-Content dist/native-assets.json

          $files = @($assets.Values | ForEach-Object { $_.path })
          cargo xtask sign @files
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }

          cargo xtask manifest `
            --version "${{ steps.version.outputs.VERSION }}" `
            --assets-json dist/native-assets.json `
            --notes @'
          ${{ needs.changelog.outputs.body }}
          '@ `
            --out-file dist/latest-native.json

          cargo xtask sign dist/latest-native.json
          if ($LASTEXITCODE -ne 0) { throw "signing the manifest failed" }

          # MSIX, DEB and AppImage are standalone release assets (not self-update assets in
          # latest-native.json), so they are signed and guarded here.
          $guarded = @() + @($files) + @("dist/latest-native.json")
          if ($env:HAS_WINDOWS -eq 'true') {
            $msix = "dist/limedl-native-v${{ steps.version.outputs.VERSION }}-windows-x86_64.msix"
            cargo xtask sign $msix
            if ($LASTEXITCODE -ne 0) { throw "signing the MSIX failed" }
            $guarded += $msix
          }
          if ($env:HAS_LINUX -eq 'true') {
            $deb = "dist/limedl-native-v${{ steps.version.outputs.VERSION }}-linux-x86_64.deb"
            if (Test-Path $deb) {
              cargo xtask sign $deb
              if ($LASTEXITCODE -ne 0) { throw "signing the DEB failed" }
              $guarded += $deb
            }
            $appimage = "dist/limedl-native-v${{ steps.version.outputs.VERSION }}-linux-x86_64.AppImage"
            if (Test-Path $appimage) {
              cargo xtask sign $appimage
              if ($LASTEXITCODE -ne 0) { throw "signing the AppImage failed" }
              $guarded += $appimage
            }
          }

          cargo xtask guard @guarded
          if ($LASTEXITCODE -ne 0) { throw "release guard failed" }
        env:
          HAS_WINDOWS: ${{ needs.build-native.result == 'success' }}
          HAS_MACOS: ${{ needs.build-native-macos.result == 'success' }}
          HAS_LINUX: ${{ needs.build-native-linux.result == 'success' }}

      # The manifest always exists (it just omits a platform whose leg failed),
      # so the release flips out of prerelease here — by then every desktop job
      # has finished and "latest" resolves to a complete set.
      - name: Upload manifest
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            dist/latest-native.json
            dist/latest-native.json.sig
            dist/latest-native.json.pqc.sig
            dist/limedl-native-v*-windows-x86_64.msix
            dist/limedl-native-v*-windows-x86_64.msix.sig
            dist/limedl-native-v*-windows-x86_64.msix.pqc.sig
            dist/limedl-native-v*-linux-x86_64.deb.sig
            dist/limedl-native-v*-linux-x86_64.deb.pqc.sig
            dist/limedl-native-v*-linux-x86_64.AppImage.sig
            dist/limedl-native-v*-linux-x86_64.AppImage.pqc.sig
          body: ${{ needs.changelog.outputs.body }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
