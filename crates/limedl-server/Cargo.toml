[package]
name = "limedl-server"
version.workspace = true
description = "Headless download daemon and CLI for limedl — axum HTTP/WebSocket JSON-RPC server"
license.workspace = true
edition = "2024"

[[bin]]
name = "limedl"
path = "src/main.rs"

[lib]
name = "limedl_server"
path = "src/lib.rs"

[features]
default = []
tls = ["axum-server"]
embed-frontend = ["dep:rust-embed"]

[dependencies]
limedl-core = { path = "../limedl-core", features = ["aria2-rpc"] }
axum = { workspace = true }
axum-server = { version = "0.8", features = ["tls-rustls"], optional = true }
tower-http = { workspace = true, features = [
  "fs",
  "set-header",
  "limit",
  "compression-gzip",
  "compression-br",
  "compression-zstd",
] }
governor = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
futures-util = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
rust-embed = { workspace = true, optional = true }
tower = { workspace = true }

[dev-dependencies]
limedl-core = { path = "../limedl-core", features = ["test-utils"] }
tokio = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
ntest = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
